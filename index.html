<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Moswax POS</title>
<style>
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--bg4:#1f2b47;
  --accent:#00d4ff;--accent2:#0099cc;--green:#00e676;--red:#ff5252;
  --orange:#ffab40;--yellow:#ffd740;--text:#e8e8e8;--text2:#9aa;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw}
input,select,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;outline:none}
input,select,textarea{outline:none;border:1px solid var(--bg4);background:var(--bg2);color:var(--text);padding:10px 14px;border-radius:8px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e)}
.login-box{background:var(--bg2);padding:40px 30px;border-radius:20px;width:90%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.login-box h1{color:var(--accent);font-size:28px;margin-bottom:6px}
.login-box p{color:var(--text2);margin-bottom:24px;font-size:14px}
.login-box input{margin-bottom:14px;text-align:center;font-size:16px}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;font-size:16px;border-radius:10px;margin-top:6px}
.login-box .err{color:var(--red);font-size:13px;margin-top:8px;min-height:20px}

/* APP SHELL */
#appShell{display:none;height:100vh;flex-direction:column}
.topbar{background:var(--bg2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bg4);min-height:52px;z-index:100}
.topbar .brand{color:var(--accent);font-weight:800;font-size:18px}
.topbar .user-info{font-size:12px;color:var(--text2);text-align:right}
.topbar .user-info strong{color:var(--text);display:block}
.main-area{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--bg4);overflow-y:auto;display:flex;flex-direction:column;padding:8px 0}
.sidebar button{display:flex;align-items:center;gap:10px;padding:12px 18px;background:none;color:var(--text2);font-size:14px;text-align:left;width:100%;transition:.2s}
.sidebar button:hover,.sidebar button.active{background:var(--bg3);color:var(--accent)}
.sidebar button .icon{font-size:18px;width:24px;text-align:center}
.content{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page{display:none}
.page.active{display:block}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--bg2);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card .label{font-size:12px;color:var(--text2);margin-bottom:4px}
.card .value{font-size:26px;font-weight:700;color:var(--accent)}
.card .value.green{color:var(--green)}
.card .value.red{color:var(--red)}
.card .value.orange{color:var(--orange)}

/* TABLES */
.tbl-wrap{overflow-x:auto;background:var(--bg2);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:10px 12px;text-align:left;color:var(--text2);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--bg4);white-space:nowrap}
tr:hover td{background:rgba(0,212,255,.04)}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#000}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--orange);color:#000}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:14px 28px;font-size:16px}

/* POS LAYOUT */
.pos-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;height:calc(100vh - 92px)}
.pos-products{display:flex;flex-direction:column;overflow:hidden}
.pos-search{display:flex;gap:8px;margin-bottom:12px}
.pos-search input{flex:1;font-size:16px;padding:12px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;overflow-y:auto;flex:1;padding:4px}
.pos-item{background:var(--bg2);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.pos-item:hover{border-color:var(--accent)}
.pos-item .name{font-size:13px;font-weight:600;margin-bottom:4px}
.pos-item .price{color:var(--accent);font-weight:700}
.pos-item .stock{font-size:11px;color:var(--text2)}
.pos-item.out{opacity:.4;pointer-events:none}

/* CART */
.pos-cart{background:var(--bg2);border-radius:var(--radius);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cart-header{padding:14px 16px;border-bottom:1px solid var(--bg4);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cart-items{flex:1;overflow-y:auto;padding:8px}
.cart-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--bg4);font-size:13px}
.cart-row .cname{flex:1}
.cart-row .cqty{display:flex;align-items:center;gap:4px}
.cart-row .cqty button{width:26px;height:26px;border-radius:6px;background:var(--bg3);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center}
.cart-row .ctotal{font-weight:700;color:var(--accent);min-width:60px;text-align:right}
.cart-row .cremove{color:var(--red);cursor:pointer;font-size:16px}
.cart-footer{padding:14px 16px;border-top:1px solid var(--bg4)}
.cart-totals{margin-bottom:12px}
.cart-totals div{display:flex;justify-content:space-between;margin-bottom:4px;font-size:14px}
.cart-totals .grand{font-size:20px;font-weight:800;color:var(--accent)}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cart-actions button{padding:12px;border-radius:8px;font-weight:700;font-size:14px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--bg4);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:18px}
.modal-head .close{background:none;color:var(--text2);font-size:22px}
.modal-body{padding:20px}
.modal-body .field{margin-bottom:14px}
.modal-body .field label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bg4);display:flex;gap:8px;justify-content:flex-end}

/* FORM GRID */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}

/* RECEIPT */
.receipt{background:#fff;color:#000;padding:20px;font-family:'Courier New',monospace;font-size:12px;max-width:300px;margin:0 auto;border-radius:4px}
.receipt h2{text-align:center;font-size:16px;margin-bottom:2px}
.receipt .r-center{text-align:center}
.receipt .r-line{border-top:1px dashed #000;margin:8px 0}
.receipt table{width:100%}
.receipt td{padding:2px 0}
.receipt .r-right{text-align:right}
.receipt .r-bold{font-weight:700}

/* BADGES */
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(0,230,118,.15);color:var(--green)}
.badge-red{background:rgba(255,82,82,.15);color:var(--red)}
.badge-orange{background:rgba(255,171,64,.15);color:var(--orange)}
.badge-blue{background:rgba(0,212,255,.15);color:var(--accent)}

/* ALERTS */
.alert-bar{padding:10px 16px;border-radius:8px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:8px}
.alert-warn{background:rgba(255,171,64,.12);color:var(--orange);border:1px solid rgba(255,171,64,.3)}
.alert-info{background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.2)}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{padding:8px 16px;background:var(--bg2);color:var(--text2);border-radius:8px 8px 0 0;font-size:13px;white-space:nowrap}
.tabs button.active{background:var(--bg3);color:var(--accent)}

/* MOBILE NAV */
.bottom-nav{display:none;background:var(--bg2);border-top:1px solid var(--bg4);padding:6px 0 env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--text2);font-size:10px;padding:6px}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav button .icon{font-size:20px}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .pos-layout{grid-template-columns:1fr;height:auto}
  .pos-cart{max-height:50vh}
  .form-grid{grid-template-columns:1fr}
  .content{padding:12px}
  .cards{grid-template-columns:repeat(2,1fr)}
}

/* PAYMENT MODAL EXTRAS */
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.pay-method{padding:16px;background:var(--bg3);border-radius:10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:.2s}
.pay-method:hover,.pay-method.selected{border-color:var(--accent);background:var(--bg4)}
.pay-method .pm-icon{font-size:28px;margin-bottom:4px}
.pay-method .pm-label{font-size:12px;font-weight:600}
.split-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.split-row select{width:120px}
.split-row input{flex:1}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);padding:12px 24px;border-radius:10px;font-size:14px;z-index:2000;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

/* SETTINGS */
.settings-section{background:var(--bg2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.settings-section h3{margin-bottom:14px;color:var(--accent);font-size:16px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bg4)}
.setting-row:last-child{border:none}
.setting-row label{font-size:14px}
.toggle{width:44px;height:24px;background:var(--bg4);border-radius:12px;position:relative;cursor:pointer;transition:.2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}
.toggle.on::after{left:22px}

/* PRINT */
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🏪 Moswax POS</h1>
    <p>Offline Point of Sale System</p>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="appShell">
  <div class="topbar">
    <div class="brand">🏪 Moswax POS</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="shiftBadge" class="badge badge-orange">Shift Closed</span>
      <div class="user-info">
        <strong id="topUser">Admin</strong>
        <span id="topRole">admin</span>
      </div>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main-area">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="content" id="contentArea"></div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">Modal</h3>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- RECEIPT PRINT AREA -->
<div id="printArea" style="display:none"></div>

<script>
// ===================== DATABASE (IndexedDB) =====================
const DB_NAME='MoswaxPOS';const DB_VER=2;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{
    const d=e.target.result;
    const stores=['users','products','categories','sales','saleItems','payments','inventoryLog','shifts','settings','heldSales'];
    stores.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})});
  };
  r.onsuccess=e=>{db=e.target.result;res(db)};
  r.onerror=e=>rej(e);
})}
function dbGet(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store);const s=tx.objectStore(store);const r=s.get(id);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store);const s=tx.objectStore(store);const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbPut(store,data){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);const r=s.put(data);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbAdd(store,data){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);const r=s.add(data);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbDel(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);const r=s.delete(id);r.onsuccess=()=>res();r.onerror=rej})}
function dbClear(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);const r=s.clear();r.onsuccess=()=>res();r.onerror=rej})}

// ===================== STATE =====================
let currentUser=null;
let currentShift=null;
let cart=[];
let heldSales=[];
let currentPage='dashboard';

const ROLES={
  admin:{label:'Admin',perms:['all']},
  gm:{label:'General Manager',perms:['dashboard','pos','products','inventory','sales','reports','shifts','users','settings']},
  im:{label:'Inventory Manager',perms:['dashboard','products','inventory','reports']},
  supervisor:{label:'Supervisor',perms:['dashboard','pos','sales','reports','shifts']},
  cashier:{label:'Cashier',perms:['pos','sales','shifts']}
};
function hasPerm(p){if(!currentUser)return false;if(currentUser.role==='admin')return true;return(ROLES[currentUser.role]?.perms||[]).includes(p)}

// ===================== INIT =====================
async function init(){
  await openDB();
  let users=await dbGetAll('users');
  if(!users.length){
    await dbAdd('users',{username:'admin',password:'admin123',name:'Administrator',role:'admin',active:true,createdAt:new Date().toISOString()});
    await dbAdd('categories',{name:'General',active:true});
    await dbPut('settings',{id:1,storeName:'Moswax Shop',address:'',phone:'',taxRate:0,taxName:'Tax',receiptFooter:'Thank you for shopping!',currency:'$',logo:''});
  }
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  document.getElementById('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
  document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}

// ===================== AUTH =====================
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const users=await dbGetAll('users');
  const found=users.find(x=>x.username===u&&x.password===p&&x.active);
  if(!found){document.getElementById('loginErr').textContent='Invalid credentials';return}
  currentUser=found;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='flex';
  document.getElementById('topUser').textContent=found.name;
  document.getElementById('topRole').textContent=ROLES[found.role]?.label||found.role;
  buildNav();
  navigate('dashboard');
}
function doLogout(){
  currentUser=null;currentShift=null;cart=[];
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
  document.getElementById('loginErr').textContent='';
}

// ===================== NAVIGATION =====================
const NAV_ITEMS=[
  {id:'dashboard',icon:'📊',label:'Dashboard',perm:'dashboard'},
  {id:'pos',icon:'🛒',label:'POS',perm:'pos'},
  {id:'products',icon:'📦',label:'Products',perm:'products'},
  {id:'inventory',icon:'📋',label:'Inventory',perm:'inventory'},
  {id:'sales',icon:'💰',label:'Sales',perm:'sales'},
  {id:'reports',icon:'📈',label:'Reports',perm:'reports'},
  {id:'users',icon:'👥',label:'Users',perm:'users'},
  {id:'shifts',icon:'⏰',label:'Shifts',perm:'shifts'},
  {id:'settings',icon:'⚙️',label:'Settings',perm:'settings'},
  {id:'backup',icon:'💾',label:'Backup',perm:'settings'}
];
function buildNav(){
  const sb=document.getElementById('sidebar');
  const bn=document.getElementById('bottomNav');
  sb.innerHTML='';
  const mobileItems=['dashboard','pos','products','sales','settings'];
  bn.innerHTML='';
  NAV_ITEMS.forEach(n=>{
    if(!hasPerm(n.perm)&&n.perm!=='all')return;
    const b=document.createElement('button');
    b.innerHTML=`<span class="icon">${n.icon}</span>${n.label}`;
    b.onclick=()=>navigate(n.id);
    b.dataset.page=n.id;
    sb.appendChild(b);
    if(mobileItems.includes(n.id)){
      const mb=document.createElement('button');
      mb.innerHTML=`<span class="icon">${n.icon}</span>${n.label}`;
      mb.onclick=()=>navigate(n.id);
      mb.dataset.page=n.id;
      bn.appendChild(mb);
    }
  });
}
function navigate(page){
  if(!hasPerm(page)&&page!=='dashboard')return;
  currentPage=page;
  document.querySelectorAll('.sidebar button,.bottom-nav button').forEach(b=>{
    b.classList.toggle('active',b.dataset.page===page);
  });
  const c=document.getElementById('contentArea');
  c.innerHTML='';
  const p=document.createElement('div');
  p.className='page active';
  c.appendChild(p);
  const renderers={dashboard:renderDashboard,pos:renderPOS,products:renderProducts,inventory:renderInventory,sales:renderSales,reports:renderReports,users:renderUsers,shifts:renderShifts,settings:renderSettings,backup:renderBackup};
  if(renderers[page])renderers[page](p);
}

// ===================== HELPERS =====================
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function openModal(title,bodyHTML,footHTML=''){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  document.getElementById('modalFoot').innerHTML=footHTML;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function fmt(n){const s=localStorage.getItem('moswax_settings');const settings=s?JSON.parse(s):{};const c=settings.currency||'$';return c+Number(n||0).toFixed(2)}
function fmtDate(d){if(!d)return'-';const dt=new Date(d);return dt.toLocaleDateString()+' '+dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function genReceiptNo(){return 'RCP-'+Date.now().toString(36).toUpperCase()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// ===================== DASHBOARD =====================
async function renderDashboard(el){
  const sales=await dbGetAll('sales');
  const products=await dbGetAll('products');
  const today=new Date().toDateString();
  const todaySales=sales.filter(s=>new Date(s.date).toDateString()===today);
  const todayRev=todaySales.reduce((a,s)=>a+s.total,0);
  const lowStock=products.filter(p=>p.stock<=p.reorderLevel&&p.stock>0);
  const outStock=products.filter(p=>p.stock<=0);
  el.innerHTML=`
    <h2 style="margin-bottom:16px">📊 Dashboard</h2>
    ${outStock.length?`<div class="alert-bar alert-warn">⚠️ ${outStock.length} product(s) out of stock!</div>`:''}
    ${lowStock.length?`<div class="alert-bar alert-warn">📉 ${lowStock.length} product(s) low on stock</div>`:''}
    <div class="cards">
      <div class="card"><div class="label">Today's Sales</div><div class="value green">${fmt(todayRev)}</div></div>
      <div class="card"><div class="label">Transactions</div><div class="value">${todaySales.length}</div></div>
      <div class="card"><div class="label">Total Products</div><div class="value">${products.length}</div></div>
      <div class="card"><div class="label">Low Stock</div><div class="value orange">${lowStock.length}</div></div>
    </div>

        </div>
        <div class="cart-items" id="cartItems">${renderCartItems()}</div>
        <div class="cart-footer">
          <div class="cart-totals">
            <div><span>Subtotal</span><span id="cartSub">${fmt(cart.reduce((a,c)=>a+c.price*c.qty,0))}</span></div>
            <div><span>${settings[0]?.taxName||'Tax'} (${taxRate}%)</span><span id="cartTax">${fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*taxRate/100)}</span></div>
            <div class="grand"><span>Total</span><span id="cartTotal">${fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*(1+taxRate/100))}</span></div>
          </div>
          <div class="cart-actions">
            <button class="btn btn-danger" onclick="clearCart()">Clear</button>
            <button class="btn btn-success btn-lg" onclick="openPayment()" ${!cart.length?'disabled style="opacity:.5"':''}>💳 Pay</button>
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('posSearch').focus();
}
function renderCartItems(){
  return cart.map((c,i)=>`<div class="cart-row">
    <span class="cname">${c.name}</span>
    <div class="cqty">
      <button onclick="changeQty(${i},-1)">−</button>
      <span>${c.qty}</span>
      <button onclick="changeQty(${i},1)">+</button>
    </div>
    <span class="ctotal">${fmt(c.price*c.qty)}</span>
    <span class="cremove" onclick="removeFromCart(${i})">✕</span>
  </div>`).join('')||'<div style="text-align:center;padding:30px;color:var(--text2)">Cart is empty</div>';
}
function updateCartUI(){
  const ci=document.getElementById('cartItems');if(!ci)return;
  ci.innerHTML=renderCartItems();
  const settings=JSON.parse(localStorage.getItem('moswax_settings')||'{}');
  const taxRate=settings.taxRate||0;
  const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
  document.getElementById('cartSub').textContent=fmt(sub);
  document.getElementById('cartTax').textContent=fmt(sub*taxRate/100);
  document.getElementById('cartTotal').textContent=fmt(sub*(1+taxRate/100));
  document.querySelector('.cart-header span').textContent=`🛒 Cart (${cart.length})`;
}
async function addToCart(pid){
  const p=await dbGet('products',pid);
  if(!p||p.stock<=0)return toast('Out of stock!');
  const existing=cart.find(c=>c.productId===pid);
  if(existing){
    if(existing.qty>=p.stock)return toast('Not enough stock!');
    existing.qty++;
  }else{
    cart.push({productId:pid,name:p.name,price:p.price,qty:1,maxStock:p.stock});
  }
  updateCartUI();
}
function changeQty(i,d){
  cart[i].qty+=d;
  if(cart[i].qty<=0)cart.splice(i,1);
  if(cart[i]&&cart[i].qty>cart[i].maxStock){cart[i].qty=cart[i].maxStock;toast('Max stock reached')}
  updateCartUI();
}
function removeFromCart(i){cart.splice(i,1);updateCartUI()}
function clearCart(){cart=[];updateCartUI()}
function filterPOSProducts(){
  const q=document.getElementById('posSearch').value.toLowerCase();
  const cat=document.getElementById('posCatFilter').value;
  document.querySelectorAll('.pos-item').forEach(el=>{
    const matchName=el.dataset.name.includes(q);
    const matchBarcode=el.dataset.barcode.includes(q);
    const matchCat=!cat||el.dataset.cat===cat;
    el.style.display=(matchName||matchBarcode)&&matchCat?'':'none';
  });
}

// HOLD / RESUME
function holdSale(){
  if(!cart.length)return toast('Cart is empty');
  const held=JSON.parse(localStorage.getItem('moswax_held')||'[]');
  held.push({id:uid(),items:[...cart],date:new Date().toISOString(),cashier:currentUser.name});
  localStorage.setItem('moswax_held',JSON.stringify(held));
  cart=[];updateCartUI();toast('Sale held');
}
function showHeldSales(){
  const held=JSON.parse(localStorage.getItem('moswax_held')||'[]');
  if(!held.length)return toast('No held sales');
  openModal('Held Sales',held.map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--bg4)">
    <div><strong>${h.items.length} items</strong><br><small style="color:var(--text2)">${fmtDate(h.date)} - ${h.cashier}</small></div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-primary btn-sm" onclick="resumeSale('${h.id}')">Resume</button>
      <button class="btn btn-danger btn-sm" onclick="deleteHeld('${h.id}')">Delete</button>
    </div>
  </div>`).join(''));
}
function resumeSale(id){
  const held=JSON.parse(localStorage.getItem('moswax_held')||'[]');
  const h=held.find(x=>x.id===id);
  if(h){cart=h.items;updateCartUI()}
  localStorage.setItem('moswax_held',JSON.stringify(held.filter(x=>x.id!==id)));
  closeModal();toast('Sale resumed');
}
function deleteHeld(id){
  const held=JSON.parse(localStorage.getItem('moswax_held')||'[]');
  localStorage.setItem('moswax_held',JSON.stringify(held.filter(x=>x.id!==id)));
  closeModal();showHeldSales();
}

// PAYMENT
function openPayment(){
  if(!cart.length)return;
  const settings=JSON.parse(localStorage.getItem('moswax_settings')||'{}');
  const taxRate=settings.taxRate||0;
  const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const total=sub*(1+taxRate/100);
  openModal('💳 Payment',`
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:14px;color:var(--text2)">Total Amount</div><div style="font-size:36px;font-weight:800;color:var(--accent)">${fmt(total)}</div></div>
    <div class="pay-methods">
      <div class="pay-method selected" onclick="selectPayMethod(this,'cash')"><div class="pm-icon">💵</div><div class="pm-label">Cash</div></div>
      <div class="pay-method" onclick="selectPayMethod(this,'card')"><div class="pm-icon">💳</div><div class="pm-label">Card</div></div>
      <div class="pay-method" onclick="selectPayMethod(this,'mobile')"><div class="pm-icon">📱</div><div class="pm-label">Mobile</div></div>
    </div>
    <div id="cashSection">
      <div class="field"><label>Amount Received</label><input type="number" id="amountReceived" value="${total.toFixed(2)}" oninput="calcChange(${total})"></div>
      <div style="text-align:center;font-size:20px;font-weight:700;color:var(--green)" id="changeDisplay">Change: ${fmt(0)}</div>
    </div>
    <div id="splitSection" style="margin-top:12px">
      <label style="font-size:13px;color:var(--text2)"><input type="checkbox" id="splitCheck" onchange="toggleSplit()"> Split Payment</label>
      <div id="splitRows" style="display:none;margin-top:8px"></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Customer Name (optional)</label><input type="text" id="payCustomer" placeholder="Walk-in customer"></div>
  `,`<button class="btn btn-success btn-lg" style="width:100%" onclick="completeSale(${total})">✅ Complete Sale</button>`);
  window._payMethod='cash';
}
function selectPayMethod(el,method){
  document.querySelectorAll('.pay-method').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  window._payMethod=method;
  document.getElementById('cashSection').style.display=method==='cash'?'block':'none';
}
function calcChange(total){
  const received=parseFloat(document.getElementById('amountReceived').value)||0;
  const change=Math.max(0,received-total);
  document.getElementById('changeDisplay').textContent='Change: '+fmt(change);
}
function toggleSplit(){
  const on=document.getElementById('splitCheck').checked;
  document.getElementById('splitRows').style.display=on?'block':'none';
  if(on){
    document.getElementById('splitRows').innerHTML=`
      <div class="split-row"><select><option>Cash</option><option>Card</option><option>Mobile</option></select><input type="number" placeholder="Amount"></div>
      <div class="split-row"><select><option>Card</option><option>Cash</option><option>Mobile</option></select><input type="number" placeholder="Amount"></div>`;
  }
}
async function completeSale(total){
  const settings=await dbGetAll('settings');
  const taxRate=settings[0]?.taxRate||0;
  const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const receiptNo=genReceiptNo();
  const customer=document.getElementById('payCustomer')?.value||'Walk-in';
  const isSplit=document.getElementById('splitCheck')?.checked;
  let paymentMethod=window._payMethod;
  if(isSplit)paymentMethod='Split';
  if(paymentMethod==='card')paymentMethod='Card (External)';

  const sale={receiptNo,date:new Date().toISOString(),cashierId:currentUser.id,cashierName:currentUser.name,customer,subtotal:sub,tax:sub*taxRate/100,total,paymentMethod,shiftId:currentShift?.id,itemCount:cart.length};
  const saleId=await dbAdd('sales',sale);

  for(const c of cart){
    await dbAdd('saleItems',{saleId,productId:c.productId,name:c.name,price:c.price,qty:c.qty,total:c.price*c.qty});
    const p=await dbGet('products',c.productId);
    if(p){p.stock=Math.max(0,p.stock-c.qty);await dbPut('products',p)}
    await dbAdd('inventoryLog',{productId:c.productId,type:'sale',qty:-c.qty,date:new Date().toISOString(),user:currentUser.name,ref:receiptNo});
  }
  await dbAdd('payments',{saleId,method:paymentMethod,amount:total,date:new Date().toISOString()});

  cart=[];
  closeModal();
  toast('✅ Sale completed!');
  showReceipt(sale);
  navigate('pos');
}

async function doStockMove(type){
  const pid=parseInt(document.getElementById('stockProduct').value);
  const qty=parseInt(document.getElementById('stockQty').value)||0;
  const note=document.getElementById('stockNote').value;
  if(!qty)return toast('Enter quantity');
  const p=await dbGet('products',pid);
  if(!p)return;
  if(type==='in')p.stock+=qty;
  else if(type==='out')p.stock=Math.max(0,p.stock-qty);
  else p.stock=Math.max(0,qty);
  await dbPut('products',p);
  await dbAdd('inventoryLog',{productId:pid,productName:p.name,type,qty:type==='adjust'?qty:(type==='in'?qty:-qty),date:new Date().toISOString(),user:currentUser.name,ref:note});
  closeModal();toast('Stock updated');navigate('inventory');
}

      <td><span class="badge badge-blue">${s.paymentMethod}</span></td>
      <td><button class="btn btn-outline btn-sm" onclick="viewSale(${s.id})">View</button></td>
    </tr>`).join('')}
    </table></div>`;
}
function filterSales(){
  const from=document.getElementById('salesDateFrom').value;
  const to=document.getElementById('salesDateTo').value;
  const cashier=document.getElementById('salesCashier').value;
  const pay=document.getElementById('salesPay').value;
  document.querySelectorAll('#salesTable tr[data-date]').forEach(r=>{
    let show=true;
    if(from&&r.dataset.date<from)show=false;
    if(to&&r.dataset.date>to)show=false;
    if(cashier&&r.dataset.cashier!==cashier)show=false;
    if(pay&&!r.dataset.pay.includes(pay))show=false;
    r.style.display=show?'':'none';
  });
}
async function viewSale(id){
  const sale=await dbGet('sales',id);
  if(!sale)return;
  showReceipt(sale);
}

async function renderReports(el){

      </div>
    </div>
    <div class="settings-section"><h3>🏆 Top Selling Products</h3>
      <div class="tbl-wrap"><table><tr><th>#</th><th>Product</th><th>Qty Sold</th></tr>
      ${topList.map(([name,qty],i)=>`<tr><td>${i+1}</td><td>${name}</td><td>${qty}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:var(--text2)">No data</td></tr>'}
      </table></div>
    </div>
    <button class="btn btn-primary" onclick="exportReport()">📤 Export Report (CSV)</button>`;
}
async function exportReport(){
  const sales=await dbGetAll('sales');
  let csv='Receipt,Date,Cashier,Customer,Items,Subtotal,Tax,Total,Payment\n';
  sales.forEach(s=>{csv+=`${s.receiptNo},${s.date},${s.cashierName},${s.customer||''},${s.itemCount},${s.subtotal},${s.tax},${s.total},${s.paymentMethod}\n`});
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moswax_report.csv';a.click();
  toast('Report exported');
}
