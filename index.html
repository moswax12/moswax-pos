<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Moswax POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--b2:#1e293b;--b3:#334155;--b4:#475569;--ac:#38bdf8;--gn:#22c55e;--rd:#ef4444;--or:#f59e0b;--tx:#f1f5f9;--tx2:#94a3b8}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden;font-size:14px}
input,select,button,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{background:var(--b2);border:1px solid var(--b3);color:var(--tx);padding:10px 12px;border-radius:8px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:60px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--b3);border-radius:3px}
#login{display:flex;align-items:center;justify-content:center;height:100dvh;background:linear-gradient(135deg,#0f172a,#1e293b)}
.lb{background:var(--b2);padding:32px 24px;border-radius:16px;width:90%;max-width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.lb h1{color:var(--ac);font-size:24px;margin-bottom:4px}
.lb p{color:var(--tx2);font-size:13px;margin-bottom:20px}
.lb input{margin-bottom:10px;text-align:center;font-size:15px}
.lb .btn-login{width:100%;padding:13px;background:var(--ac);color:#000;font-weight:700;border-radius:10px;font-size:15px;margin-top:4px}
.lb .err{color:var(--rd);font-size:12px;min-height:16px;margin-top:6px}
#app{display:none;height:100dvh;flex-direction:column}
.topbar{background:var(--b2);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b3);min-height:48px}
.topbar .logo{color:var(--ac);font-weight:800;font-size:16px}
.topbar .right{display:flex;align-items:center;gap:8px}
.topbar .uname{font-size:11px;color:var(--tx2);text-align:right;line-height:1.3}
.topbar .uname b{color:var(--tx);display:block;font-size:12px}
.mid{display:flex;flex:1;overflow:hidden}
.side{width:180px;background:var(--b2);border-right:1px solid var(--b3);overflow-y:auto;padding:6px 0}
.side button{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;font-size:13px;color:var(--tx2);text-align:left}
.side button.on{background:var(--b3);color:var(--ac);font-weight:600}
.main{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
.pg{display:none}.pg.on{display:block}
.bnav{display:none;background:var(--b2);border-top:1px solid var(--b3);padding:2px 0 env(safe-area-inset-bottom)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:9px;color:var(--tx2)}
.bnav button.on{color:var(--ac)}.bnav button span{font-size:18px}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.cd{background:var(--b2);border-radius:10px;padding:14px}
.cd .cl{font-size:11px;color:var(--tx2);margin-bottom:2px}
.cd .cv{font-size:20px;font-weight:700;color:var(--ac)}
.cd .g{color:var(--gn)}.cd .r{color:var(--rd)}.cd .o{color:var(--or)}
.tw{overflow-x:auto;background:var(--b2);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--b3);padding:9px 10px;text-align:left;color:var(--tx2);white-space:nowrap;font-weight:600}
td{padding:9px 10px;border-top:1px solid var(--b3);white-space:nowrap}
.btn{padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.bp{background:var(--ac);color:#000}.bs{background:var(--gn);color:#000}
.bd{background:var(--rd);color:#fff}.bw{background:var(--or);color:#000}
.bo{border:1px solid var(--ac);color:var(--ac)}.sm{padding:4px 8px;font-size:11px}
.bg{padding:2px 7px;border-radius:12px;font-size:10px;font-weight:600}
.bg-g{background:rgba(34,197,94,.15);color:var(--gn)}
.bg-r{background:rgba(239,68,68,.15);color:var(--rd)}
.bg-o{background:rgba(245,158,11,.15);color:var(--or)}
.bg-b{background:rgba(56,189,248,.15);color:var(--ac)}
.al{padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:12px}
.al-w{background:rgba(245,158,11,.1);color:var(--or);border:1px solid rgba(245,158,11,.2)}
.pos{display:grid;grid-template-columns:1fr 340px;gap:10px;height:calc(100dvh - 72px)}
.psearch{display:flex;gap:6px;margin-bottom:8px}.psearch input{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;overflow-y:auto;flex:1}
.pi{background:var(--b2);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;border:2px solid transparent}
.pi:active{border-color:var(--ac)}
.pi .pn{font-size:11px;font-weight:600}.pi .pp{color:var(--ac);font-weight:700;font-size:12px}.pi .ps{font-size:9px;color:var(--tx2)}
.pi.out{opacity:.3;pointer-events:none}
.cart{background:var(--b2);border-radius:10px;display:flex;flex-direction:column}
.cart-h{padding:10px;border-bottom:1px solid var(--b3);font-weight:700;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cart-i{flex:1;overflow-y:auto;padding:4px}
.cr{display:flex;align-items:center;gap:4px;padding:5px 4px;border-bottom:1px solid var(--b3);font-size:12px}
.cr .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .cq{display:flex;align-items:center;gap:2px}
.cr .cq button{width:22px;height:22px;border-radius:5px;background:var(--b3);font-size:14px;display:flex;align-items:center;justify-content:center}
.cr .ct{font-weight:700;color:var(--ac);min-width:50px;text-align:right}
.cr .cx{color:var(--rd);font-size:14px;padding:2px}
.cart-f{padding:10px;border-top:1px solid var(--b3)}
.ctot div{display:flex;justify-content:space-between;margin-bottom:2px;font-size:12px}
.ctot .gt{font-size:17px;font-weight:800;color:var(--ac)}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cact button{padding:11px;border-radius:8px;font-weight:700;font-size:13px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center;padding:12px}
.mo.sh{display:flex}
.md{background:var(--b2);border-radius:14px;width:100%;max-width:500px;max-height:88dvh;overflow-y:auto}
.mh{padding:14px;border-bottom:1px solid var(--b3);display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:16px}.mh .x{font-size:20px;color:var(--tx2);padding:4px}
.mb{padding:14px}.mb .f{margin-bottom:10px}
.mb .f label{display:block;font-size:11px;color:var(--tx2);margin-bottom:3px}
.mf{padding:10px 14px;border-top:1px solid var(--b3);display:flex;gap:6px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fg .fl{grid-column:1/-1}
.rcp{background:#fff;color:#000;padding:14px;font-family:monospace;font-size:11px;max-width:270px;margin:0 auto;border-radius:4px}
.rcp h2{text-align:center;font-size:14px;margin-bottom:2px}
.rcp .rc{text-align:center}.rcp .rl{border-top:1px dashed #000;margin:5px 0}
.rcp table{width:100%}.rcp td{padding:1px 0}.rcp .rr{text-align:right}
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.pms div{padding:12px 6px;background:var(--b3);border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent}
.pms div.sel{border-color:var(--ac);background:rgba(56,189,248,.1)}
.pms .ic{font-size:22px}.pms .lb{font-size:10px;font-weight:600}
.sec{background:var(--b2);border-radius:10px;padding:14px;margin-bottom:12px}
.sec h3{margin-bottom:10px;color:var(--ac);font-size:14px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b3)}
.sr:last-child{border:none}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--b3);padding:10px 20px;border-radius:10px;font-size:13px;z-index:2000;opacity:0;transition:.3s;pointer-events:none}
.toast.sh{opacity:1}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{padding:7px 14px;background:var(--b2);color:var(--tx2);border-radius:8px 8px 0 0;font-size:12px;white-space:nowrap}
.tabs button.on{background:var(--b3);color:var(--ac);font-weight:600}
.chk{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:13px}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.offline-bar{display:none;background:var(--or);color:#000;text-align:center;padding:6px;font-size:12px;font-weight:600}
.offline-bar.show{display:block}
.acct-type{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.at-asset{background:rgba(56,189,248,.15);color:var(--ac)}
.at-liability{background:rgba(239,68,68,.15);color:var(--rd)}
.at-equity{background:rgba(168,85,247,.15);color:#a855f7}
.at-revenue{background:rgba(34,197,94,.15);color:var(--gn)}
.at-expense{background:rgba(245,158,11,.15);color:var(--or)}
.debit{color:var(--ac)}.credit{color:var(--gn)}
@media(max-width:768px){.side{display:none}.bnav{display:flex}.pos{grid-template-columns:1fr;height:auto}.cart{max-height:42dvh}.fg{grid-template-columns:1fr}.main{padding:10px}.cds{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}.rcp,.rcp *{visibility:visible}.rcp{position:absolute;left:0;top:0}}
</style>
</head>
<body>
<div class="offline-bar" id="offlineBar">📡 You are offline — Moswax POS still works!</div>
<div id="login"><div class="lb"><h1>🏪 Moswax POS</h1><p>Offline Point of Sale</p><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button class="btn-login" onclick="doLogin()">Sign In</button><div class="err" id="le"></div></div></div>
<div id="app">
<div class="topbar"><div class="logo">🏪 Moswax POS</div><div class="right"><div class="uname"><b id="tu">Admin</b><span id="tr">Admin</span></div><button class="bo sm" onclick="doLogout()">Logout</button></div></div>
<div class="mid"><nav class="side" id="side"></nav><div class="main" id="mc"></div></div>
<nav class="bnav" id="bnav"></nav>
</div>
<div class="mo" id="mo"><div class="md"><div class="mh"><h3 id="mt">Modal</h3><button class="x" onclick="cM()">✕</button></div><div class="mb" id="mbd"></div><div class="mf" id="mft"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DN='MoswaxPOS4';let db,CU=null,cart=[];
const DEF_PERMS={dashboard:1,pos:1,inventory:1,finance:1,users:1,settings:1};
const ROLE_DEFAULTS={admin:{dashboard:1,pos:1,inventory:1,finance:1,users:1,settings:1},manager:{dashboard:1,pos:1,inventory:1,finance:1,users:0,settings:1},cashier:{dashboard:0,pos:1,inventory:0,finance:0,users:0,settings:0},stock:{dashboard:0,pos:0,inventory:1,finance:0,users:0,settings:0}};
const ROLE_LABELS={admin:'Admin',manager:'Manager',cashier:'Cashier',stock:'Stock Keeper'};
function hp(m){if(!CU)return false;if(CU.perms)return!!CU.perms[m];return CU.role==='admin'||!!ROLE_DEFAULTS[CU.role]?.[m]}
function oDB(){return new Promise((y,n)=>{const r=indexedDB.open(DN,1);r.onupgradeneeded=e=>{const d=e.target.result;['users','products','categories','sales','saleItems','invLog','settings','accounts','journal'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;y()};r.onerror=n})}
function gA(s){return new Promise((y,n)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>y(r.result);r.onerror=n})}
function gO(s,id){return new Promise((y,n)=>{const r=db.transaction(s).objectStore(s).get(id);r.onsuccess=()=>y(r.result);r.onerror=n})}
function pO(s,d){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(d);r.onsuccess=()=>y(r.result);r.onerror=n})}
function aO(s,d){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).add(d);r.onsuccess=()=>y(r.result);r.onerror=n})}
function dO(s,id){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>y();r.onerror=n})}
async function init(){
try{await oDB();let u=await gA('users');
if(!u.length){
await aO('users',{username:'admin',password:'admin123',name:'Administrator',role:'admin',perms:ROLE_DEFAULTS.admin,active:true});
await aO('categories',{name:'General'});
await aO('settings',{storeName:'Moswax Shop',address:'',phone:'',taxRate:0,taxName:'VAT',footer:'Thank you for shopping!',currency:'KSh'});
const accts=[{code:'1000',name:'Cash',type:'Asset'},{code:'1010',name:'Bank',type:'Asset'},{code:'1020',name:'Accounts Receivable',type:'Asset'},{code:'1100',name:'Inventory',type:'Asset'},{code:'1200',name:'Fixed Assets',type:'Asset'},{code:'2000',name:'Accounts Payable',type:'Liability'},{code:'2100',name:'Loans Payable',type:'Liability'},{code:'3000',name:"Owner's Equity",type:'Equity'},{code:'3100',name:'Retained Earnings',type:'Equity'},{code:'4000',name:'Sales Revenue',type:'Revenue'},{code:'4100',name:'Other Income',type:'Revenue'},{code:'5000',name:'Cost of Goods Sold',type:'Expense'},{code:'5100',name:'Rent Expense',type:'Expense'},{code:'5200',name:'Salaries Expense',type:'Expense'},{code:'5300',name:'Utilities Expense',type:'Expense'},{code:'5400',name:'Transport Expense',type:'Expense'},{code:'5500',name:'Other Expense',type:'Expense'}];
for(const a of accts)await aO('accounts',a);
}
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}catch(e){document.getElementById('le').textContent='DB Error'}}
async function doLogin(){const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;try{const users=await gA('users');const f=users.find(x=>x.username===u&&x.password===p&&x.active);if(!f){document.getElementById('le').textContent='Invalid credentials';return}CU=f;document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('tu').textContent=f.name;document.getElementById('tr').textContent=ROLE_LABELS[f.role]||f.role;buildNav();go('dashboard')}catch(e){document.getElementById('le').textContent='Error: '+e.message}}
function doLogout(){CU=null;cart=[];document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('lu').value='';document.getElementById('lp').value='';document.getElementById('le').textContent=''}
const NAV=[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'pos',i:'🛒',l:'POS'},{id:'inventory',i:'📦',l:'Inventory'},{id:'finance',i:'💰',l:'Finance'},{id:'users',i:'👥',l:'Users'},{id:'settings',i:'⚙️',l:'Settings'}];
function buildNav(){const s=document.getElementById('side'),b=document.getElementById('bnav');s.innerHTML='';b.innerHTML='';NAV.forEach(n=>{if(!hp(n.id))return;let e=document.createElement('button');e.textContent=n.i+' '+n.l;e.onclick=()=>go(n.id);e.dataset.p=n.id;s.appendChild(e);let e2=document.createElement('button');e2.innerHTML='<span>'+n.i+'</span>'+n.l;e2.onclick=()=>go(n.id);e2.dataset.p=n.id;b.appendChild(e2)})}
function go(p){if(!hp(p))return;document.querySelectorAll('.side button,.bnav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));document.getElementById('mc').innerHTML='<div class="pg on" id="pg"></div>';const el=document.getElementById('pg');({dashboard:rDash,pos:rPOS,inventory:rInv,finance:rFin,users:rUsr,settings:rSet})[p]?.(el)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('sh');setTimeout(()=>t.classList.remove('sh'),2500)}
function oM(t,b,f=''){document.getElementById('mt').textContent=t;document.getElementById('mbd').innerHTML=b;document.getElementById('mft').innerHTML=f;document.getElementById('mo').classList.add('sh')}
function cM(){document.getElementById('mo').classList.remove('sh')}
function fmt(n){return'KSh '+Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fD(d){return d?new Date(d).toLocaleString():'-'}
function fDs(d){return d?new Date(d).toLocaleDateString('en-KE'):'-'}

/* DASHBOARD */
async function rDash(el){const sa=await gA('sales'),pr=await gA('products'),td=new Date().toDateString(),ts=sa.filter(s=>new Date(s.date).toDateString()===td),rv=ts.reduce((a,s)=>a+s.total,0),lo=pr.filter(p=>p.stock>0&&p.stock<=p.reorder),ou=pr.filter(p=>p.stock<=0),mNow=new Date(),mRev=sa.filter(s=>{const d=new Date(s.date);return d.getMonth()===mNow.getMonth()&&d.getFullYear()===mNow.getFullYear()}).reduce((a,s)=>a+s.total,0);el.innerHTML='<h2 style="margin-bottom:12px">📊 Dashboard</h2>'+(ou.length?'<div class="al al-w">⚠️ '+ou.length+' product(s) out of stock</div>':'')+(lo.length?'<div class="al al-w">📉 '+lo.length+' product(s) low stock</div>':'')+'<div class="cds"><div class="cd"><div class="cl">Today Sales</div><div class="cv g">'+fmt(rv)+'</div></div><div class="cd"><div class="cl">Orders</div><div class="cv">'+ts.length+'</div></div><div class="cd"><div class="cl">This Month</div><div class="cv">'+fmt(mRev)+'</div></div><div class="cd"><div class="cl">Products</div><div class="cv">'+pr.length+'</div></div></div><h3 style="margin:10px 0 6px">Recent Transactions</h3><div class="tw"><table><tr><th>Receipt</th><th>Date</th><th>Cashier</th><th>Total</th><th>Pay</th></tr>'+ts.slice(-8).reverse().map(s=>'<tr><td>'+s.rn+'</td><td>'+fD(s.date)+'</td><td>'+s.cashier+'</td><td><b>'+fmt(s.total)+'</b></td><td><span class="bg bg-b">'+s.pm+'</span></td></tr>').join('')+(!ts.length?'<tr><td colspan="5" style="text-align:center;color:var(--tx2);padding:20px">No sales today</td></tr>':'')+'</table></div>'}

/* POS */
async function rPOS(el){const pr=await gA('products'),ca=await gA('categories'),se=await gA('settings'),tx=se[0]?.taxRate||0;el.innerHTML='<div class="pos"><div style="display:flex;flex-direction:column;overflow:hidden"><div class="psearch"><input id="ps" placeholder="🔍 Search / scan barcode..." oninput="fP()"><select id="pc" onchange="fP()" style="width:110px"><option value="">All</option>'+ca.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select></div><div class="pgrid" id="pgr">'+pr.map(p=>'<div class="pi '+(p.stock<=0?'out':'')+'" onclick="aC('+p.id+')" data-n="'+p.name.toLowerCase()+'" data-b="'+(p.barcode||'')+'" data-c="'+p.catId+'"><div class="pn">'+p.name+'</div><div class="pp">'+fmt(p.price)+'</div><div class="ps">Stock:'+p.stock+'</div></div>').join('')+'</div></div><div class="cart"><div class="cart-h"><span>🛒 Cart('+cart.length+')</span><div style="display:flex;gap:4px"><button class="bo sm" onclick="sH()">Held</button><button class="bw sm" onclick="hS()">Hold</button></div></div><div class="cart-i" id="ci">'+rCI()+'</div><div class="cart-f"><div class="ctot"><div><span>Subtotal</span><span id="cS">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0))+'</span></div><div><span>'+(se[0]?.taxName||'VAT')+'('+tx+'%)</span><span id="cT">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*tx/100)+'</span></div><div class="gt"><span>Total</span><span id="cTo">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*(1+tx/100))+'</span></div></div><div class="cact"><button class="bd" onclick="cart=[];uC()">Clear</button><button class="bs" onclick="oPay()" '+(cart.length?'':'disabled style="opacity:.4"')+'>💳 Pay</button></div></div></div></div>'}
function rCI(){return cart.map((c,i)=>'<div class="cr"><span class="cn">'+c.name+'</span><div class="cq"><button onclick="cQ('+i+',-1)">−</button><span>'+c.qty+'</span><button onclick="cQ('+i+',1)">+</button></div><span class="ct">'+fmt(c.price*c.qty)+'</span><span class="cx" onclick="cart.splice('+i+',1);uC()">✕</span></div>').join('')||'<div style="text-align:center;padding:20px;color:var(--tx2)">Empty</div>'}
function uC(){const e=document.getElementById('ci');if(!e)return;e.innerHTML=rCI();const se=JSON.parse(localStorage.getItem('mx_s')||'{}'),tx=se.taxRate||0,sub=cart.reduce((a,c)=>a+c.price*c.qty,0);document.getElementById('cS').textContent=fmt(sub);document.getElementById('cT').textContent=fmt(sub*tx/100);document.getElementById('cTo').textContent=fmt(sub*(1+tx/100));document.querySelector('.cart-h span').textContent='🛒 Cart('+cart.length+')'}

async function sAcct(id){const d={code:document.getElementById('aCode').value.trim(),name:document.getElementById('aName').value.trim(),type:document.getElementById('aType').value};if(!d.code||!d.name)return toast('Required');if(id){d.id=id;await pO('accounts',d)}else await aO('accounts',d);cM();toast('Saved');go('finance')}

/* JOURNAL ENTRIES */
async function oJE(){const accts=await gA('accounts');const opts=accts.sort((a,b)=>a.code-b.code).map(a=>'<option value="'+a.id+'">'+a.code+' - '+a.name+'</option>').join('');oM('New Journal Entry','<div class="f"><label>Date</label><input type="date" id="jeDate" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="f"><label>Description</label><input id="jeDesc" placeholder="e.g. Paid rent for March"></div><div class="f"><label>Reference</label><input id="jeRef" placeholder="Optional"></div><h4 style="margin:10px 0 6px;color:var(--ac)">Lines</h4><div id="jeLines"><div class="fg" style="grid-template-columns:2fr 1fr 1fr;gap:4px;margin-bottom:4px"><select class="jeAcct">'+opts+'</select><input type="number" class="jeDr" placeholder="Debit" step="0.01"><input type="number" class="jeCr" placeholder="Credit" step="0.01"></div><div class="fg" style="grid-template-columns:2fr 1fr 1fr;gap:4px;margin-bottom:4px"><select class="jeAcct">'+opts+'</select><input type="number" class="jeDr" placeholder="Debit" step="0.01"><input type="number" class="jeCr" placeholder="Credit" step="0.01"></div></div><button class="bo sm" onclick="addJELine()" style="margin-top:4px">+ Add Line</button>','<button class="bp" onclick="sJE()">Post Entry</button><button class="bo" onclick="cM()">Cancel</button>')}
function addJELine(){const accts=document.querySelectorAll('.jeAcct')[0];if(!accts)return;const opts=accts.innerHTML;const d=document.createElement('div');d.className='fg';d.style.cssText='grid-template-columns:2fr 1fr 1fr;gap:4px;margin-bottom:4px';d.innerHTML='<select class="jeAcct">'+opts+'</select><input type="number" class="jeDr" placeholder="Debit" step="0.01"><input type="number" class="jeCr" placeholder="Credit" step="0.01">';document.getElementById('jeLines').appendChild(d)}
async function sJE(){const date=document.getElementById('jeDate').value;const desc=document.getElementById('jeDesc').value.trim();const ref=document.getElementById('jeRef').value.trim();if(!desc)return toast('Description required');const accts=await gA('accounts');const aMap={};accts.forEach(a=>aMap[a.id]=a);const drs=document.querySelectorAll('.jeDr'),crs=document.querySelectorAll('.jeCr'),acs=document.querySelectorAll('.jeAcct');const lines=[];let totD=0,totC=0;for(let i=0;i<acs.length;i++){const dr=parseFloat(drs[i].value)||0,cr=parseFloat(crs[i].value)||0;if(dr===0&&cr===0)continue;const aId=parseInt(acs[i].value);lines.push({acctId:aId,acctName:aMap[aId]?.name||'Unknown',debit:dr,credit:cr});totD+=dr;totC+=cr}if(!lines.length)return toast('Add at least one line');if(Math.abs(totD-totC)>0.01)return toast('Debits must equal credits! D:'+totD+' C:'+totC);await aO('journal',{date:new Date(date).toISOString(),desc,lines,ref,by:CU.name});cM();toast('Journal entry posted');go('finance')}

/* LEDGER */
async function showLedger(){const aId=parseInt(document.getElementById('ledAcct').value);const v=document.getElementById('ledgerView');if(!aId){v.innerHTML='';return}const jrn=await gA('journal');const entries=[];jrn.forEach(j=>{j.lines.forEach(l=>{if(l.acctId===aId)entries.push({date:j.date,desc:j.desc,ref:j.ref,debit:l.debit,credit:l.credit})})});entries.sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=0;const accts=await gA('accounts');const acct=accts.find(a=>a.id===aId);const isDr=acct&&(acct.type==='Asset'||acct.type==='Expense');v.innerHTML='<div class="tw" style="margin-top:8px"><table><tr><th>Date</th><th>Description</th><th>Ref</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>'+entries.map(e=>{if(isDr)bal+=e.debit-e.credit;else bal+=e.credit-e.debit;return'<tr><td>'+fDs(e.date)+'</td><td>'+e.desc+'</td><td>'+(e.ref||'-')+'</td><td class="debit">'+(e.debit?fmt(e.debit):'-')+'</td><td class="credit">'+(e.credit?fmt(e.credit):'-')+'</td><td><b>'+fmt(bal)+'</b></td></tr>'}).join('')+(!entries.length?'<tr><td colspan="6" style="text-align:center;color:var(--tx2)">No transactions</td></tr>':'')+'</table></div>'}

/* TRIAL BALANCE */
async function renderTB(){const v=document.getElementById('tbView');if(!v)return;const jrn=await gA('journal'),accts=await gA('accounts');const bals={};accts.forEach(a=>bals[a.id]={name:a.name,code:a.code,type:a.type,dr:0,cr:0});jrn.forEach(j=>j.lines.forEach(l=>{if(bals[l.acctId]){bals[l.acctId].dr+=l.debit;bals[l.acctId].cr+=l.credit}}));let totDr=0,totCr=0;const rows=Object.values(bals).filter(b=>b.dr>0||b.cr>0).sort((a,b)=>a.code-b.code);rows.forEach(b=>{const net=b.dr-b.cr;if(net>0)totDr+=net;else totCr+=Math.abs(net)});v.innerHTML='<div class="tw"><table><tr><th>Code</th><th>Account</th><th>Debit</th><th>Credit</th></tr>'+rows.map(b=>{const net=b.dr-b.cr;return'<tr><td>'+b.code+'</td><td>'+b.name+'</td><td class="debit">'+(net>0?fmt(net):'-')+'</td><td class="credit">'+(net<0?fmt(Math.abs(net)):'-')+'</td></tr>'}).join('')+'<tr style="font-weight:700;border-top:2px solid var(--ac)"><td></td><td>TOTAL</td><td class="debit">'+fmt(totDr)+'</td><td class="credit">'+fmt(totCr)+'</td></tr>'+(Math.abs(totDr-totCr)<0.01?'<tr><td colspan="4" style="text-align:center;color:var(--gn)">✅ Balanced</td></tr>':'<tr><td colspan="4" style="text-align:center;color:var(--rd)">⚠️ Out of balance by '+fmt(Math.abs(totDr-totCr))+'</td></tr>')+'</table></div>'}

/* P&L */
async function renderPL(){const v=document.getElementById('plView');if(!v)return;const jrn=await gA('journal'),accts=await gA('accounts');const bals={};accts.filter(a=>a.type==='Revenue'||a.type==='Expense').forEach(a=>bals[a.id]={name:a.name,type:a.type,dr:0,cr:0});jrn.forEach(j=>j.lines.forEach(l=>{if(bals[l.acctId]){bals[l.acctId].dr+=l.debit;bals[l.acctId].cr+=l.credit}}));let totRev=0,totExp=0;const revRows=[],expRows=[];Object.values(bals).forEach(b=>{if(b.type==='Revenue'){const net=b.cr-b.dr;totRev+=net;revRows.push({name:b.name,amt:net})}else{const net=b.dr-b.cr;totExp+=net;expRows.push({name:b.name,amt:net})}});const profit=totRev-totExp;v.innerHTML='<div class="sec"><h3>Revenue</h3>'+revRows.filter(r=>r.amt!==0).map(r=>'<div class="sr"><span>'+r.name+'</span><b class="credit">'+fmt(r.amt)+'</b></div>').join('')+'<div class="sr" style="font-weight:700"><span>Total Revenue</span><b class="credit">'+fmt(totRev)+'</b></div></div><div class="sec"><h3>Expenses</h3>'+expRows.filter(r=>r.amt!==0).map(r=>'<div class="sr"><span>'+r.name+'</span><b class="debit">'+fmt(r.amt)+'</b></div>').join('')+'<div class="sr" style="font-weight:700"><span>Total Expenses</span><b class="debit">'+fmt(totExp)+'</b></div></div><div class="sec" style="border:2px solid '+(profit>=0?'var(--gn)':'var(--rd)')+'"><h3 style="color:'+(profit>=0?'var(--gn)':'var(--rd)')+'">'+(profit>=0?'📈 Net Profit':'📉 Net Loss')+'</h3><div style="font-size:28px;font-weight:800;color:'+(profit>=0?'var(--gn)':'var(--rd)')+'">'+fmt(Math.abs(profit))+'</div></div>'}
