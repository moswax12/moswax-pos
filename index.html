function finBal(){var accts={};D.ledger.forEach(function(l){if(!accts[l.acct])accts[l.acct]={dr:0,cr:0};accts[l.acct].dr+=l.dr;accts[l.acct].cr+=l.cr;});var aAccts=['Cash','Bank','Mobile','Inventory'],lAccts=['VAT Payable'],ta=0,tl=0;var h='<div class="cd"><h3>📋 Balance Sheet</h3><div class="tw"><table><tr><td colspan="2" style="font-weight:700;padding:10px">Moswax Store — Balance Sheet</td></tr><tr><td colspan="2" style="font-weight:600;color:var(--ac)">ASSETS</td></tr>';aAccts.forEach(function(a){if(accts[a]){var b=accts[a].dr-accts[a].cr;ta+=b;h+='<tr><td>&nbsp;&nbsp;'+a+'</td><td style="text-align:right">'+fmt(b)+'</td></tr>';}});h+='<tr style="border-top:2px solid var(--bd)"><td><strong>Total Assets</strong></td><td style="text-align:right"><strong>'+fmt(ta)+'</strong></td></tr><tr><td colspan="2" style="font-weight:600;color:var(--ac);padding-top:10px">LIABILITIES</td></tr>';lAccts.forEach(function(a){if(accts[a]){var b=accts[a].cr-accts[a].dr;tl+=b;h+='<tr><td>&nbsp;&nbsp;'+a+'</td><td style="text-align:right">'+fmt(b)+'</td></tr>';}});h+='<tr style="border-top:2px solid var(--bd)"><td><strong>Total Liabilities</strong></td><td style="text-align:right"><strong>'+fmt(tl)+'</strong></td></tr>';var sBal=accts['Sales']?accts['Sales'].cr-accts['Sales'].dr:0,cBal=accts['COGS']?accts['COGS'].dr-accts['COGS'].cr:0,eBal=D.expenses.reduce(function(a,e){return a+e.amt;},0),ne=sBal-cBal-eBal;h+='<tr><td colspan="2" style="font-weight:600;color:var(--ac);padding-top:10px">EQUITY</td></tr><tr><td>&nbsp;&nbsp;Retained Earnings</td><td style="text-align:right">'+fmt(ne)+'</td></tr><tr style="border-top:2px solid var(--bd);background:rgba(79,195,247,.05)"><td><strong>TOTAL LIAB + EQUITY</strong></td><td style="text-align:right"><strong>'+fmt(tl+ne)+'</strong></td></tr></table></div></div>';return h;}
function oExp(){oM('<h2>➕ Add Expense</h2><div class="fg"><label>Description</label><input type="text" id="edesc" placeholder="Rent, Utilities..."></div><div class="fg"><label>Amount (KES)</label><input type="number" id="eamt" step="0.01" min="0" placeholder="0.00"></div><div class="ma"><button class="bt bo" onclick="closeM()">Cancel</button><button class="bt bp" onclick="sExp()">Save</button></div>');}
function sExp(){var d=document.getElementById('edesc').value.trim(),a=parseFloat(document.getElementById('eamt').value)||0;if(!d||a<=0){T('Fill in both fields','e');return;}D.expenses.push({id:D.ne++,desc:d,amt:a,d:new Date().toISOString(),u:D.curUser.name});addL(new Date().toISOString(),'Expense: '+d,0,a,'Expenses');sv();closeM();rA();T('Expense added','s');}
function dExp(id){if(!confirm('Delete?'))return;D.expenses=D.expenses.filter(function(e){return e.id!==id;});sv();rA();T('Deleted','i');}
function rUsers(){var permKeys=[{k:'dash',l:'Dashboard'},{k:'pos',l:'POS / Checkout'},{k:'inv',l:'Inventory'},{k:'fin',l:'Finance'},{k:'users',l:'Users'},{k:'set',l:'Settings'},{k:'edit_prod',l:'Edit Products'},{k:'edit_user',l:'Edit Users'},{k:'edit_set',l:'Edit Settings'},{k:'price_override',l:'Price Override'}];var h='<h2 style="font-size:1rem;margin-bottom:10px">👥 Users & Permissions</h2><div class="cd"><h3>Users <button class="bt bp bx" style="float:right" onclick="oUM()">+ Add</button></h3><div class="tw"><table><thead><tr><th>Name</th><th>User</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>';h+=D.users.map(function(u){return'<tr><td>'+u.name+'</td><td>'+u.un+'</td><td><span class="bdg bdg-b">'+D.roles[u.role].l+'</span></td><td><span class="bdg '+(u.on?'bdg-g':'bdg-r')+'">'+(u.on?'On':'Off')+'</span></td><td><button class="bt bo bx" onclick="oUM('+u.id+')">✏️</button></td></tr>';}).join('');h+='</tbody></table></div></div><div class="cd"><h3>🔐 Role Defaults</h3><p style="font-size:.7rem;color:var(--tx2);margin-bottom:8px">Default permissions per role. Individual overrides set when editing a user.</p><div class="tw"><table><thead><tr><th>Permission</th>';var rks=Object.keys(D.roles);h+=rks.map(function(r){return'<th style="text-align:center;font-size:.62rem">'+D.roles[r].l+'</th>';}).join('');h+='</tr></thead><tbody>';h+=permKeys.map(function(pk){h+='<tr><td>'+pk.l+'</td>';h+=rks.map(function(rk){return'<td style="text-align:center"><input type="checkbox" '+(D.roles[rk].p[pk.k]?'checked':'')+' onchange="tRP(\''+rk+'\',\''+pk.k+'\',this.checked)"></td>';}).join('');h+='</tr>';}).join('');h+='</tbody></table></div></div>';document.getElementById('pg-users').innerHTML=h;}
function tRP(role,perm,val){D.roles[role].p[perm]=val?1:0;D.users.forEach(function(u){if(u.role===role)u.perms[perm]=val?1:0;});sv();T('Updated','s');}
function oUM(id){var u=null;if(id)for(var i=0;i<D.users.length;i++)if(D.users[i].id===id){u=D.users[i];break;}var permKeys=[{k:'dash',l:'Dashboard'},{k:'pos',l:'POS / Checkout'},{k:'inv',l:'Inventory'},{k:'fin',l:'Finance'},{k:'users',l:'Users'},{k:'set',l:'Settings'},{k:'edit_prod',l:'Edit Products'},{k:'edit_user',l:'Edit Users'},{k:'edit_set',l:'Edit Settings'},{k:'price_override',l:'Price Override'}];var h='<h2>'+(u?'✏️ Edit':'➕ Add')+' User</h2><div class="fg"><label>Full Name</label><input type="text" id="un" value="'+(u?u.name:'')+'"></div><div class="fg"><label>Username</label><input type="text" id="uun" value="'+(u?u.un:'')+'"></div><div class="fg"><label>Password</label><input type="text" id="upw" value="'+(u?u.pw:'')+'"></div><div class="fg"><label>Role (sets defaults)</label><select id="urole" onchange="applyRoleToPerms()">'+Object.keys(D.roles).map(function(r){return'<option value="'+r+'" '+(u&&u.role===r?'selected':'')+'>'+D.roles[r].l+'</option>';}).join('')+'</select></div><div class="fg"><label>Status</label><select id="uon"><option value="1" '+(u&&u.on?'selected':'')+'>Active</option><option value="0" '+(u&&u.on===0?'selected':'')+'>Inactive</option></select></div><div class="fg"><label>Individual Permissions (override role)</label><div style="background:var(--bg3);border-radius:8px;padding:10px">';h+=permKeys.map(function(pk){var checked=u?(u.perms[pk.k]?'checked':''):(D.roles[document.getElementById('urole')?document.getElementById('urole').value:'admin'].p[pk.k]?'checked':'');return'<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.78rem"><input type="checkbox" class="iperm" data-k="'+pk.k+'" '+(checked?'checked':'')+'> '+pk.l+'</label>';}).join('');h+='</div></div><div class="ma"><button class="bt bo" onclick="closeM()">Cancel</button><button class="bt bp" onclick="sU('+(id||'null')+')">Save</button></div>';oM(h);if(!u){applyRoleToPerms();}}
function applyRoleToPerms(){var sel=document.getElementById('urole');if(!sel)return;var role=D.roles[sel.value];document.querySelectorAll('.iperm').forEach(function(cb){cb.checked=!!role.p[cb.dataset.k];});}
function sU(id){var n=document.getElementById('un').value.trim();if(!n){T('Name required','e');return;}var perms={};document.querySelectorAll('.iperm').forEach(function(cb){perms[cb.dataset.k]=cb.checked?1:0;});var data={name:n,un:document.getElementById('uun').value.trim(),pw:document.getElementById('upw').value,role:document.getElementById('urole').value,on:parseInt(document.getElementById('uon').value),perms:perms};if(id){var u=null;for(var i=0;i<D.users.length;i++)if(D.users[i].id===id){u=D.users[i];break;}if(u)for(var k in data)u[k]=data[k];}else{data.id=D.nu++;D.users.push(data);}sv();closeM();rA();T('User saved','s');}
function rSet(){var s=D.settings;var h='<h2 style="font-size:1rem;margin-bottom:10px">⚙️ Settings</h2><div class="cd"><h3>🏪 Store Info</h3><div class="fg"><label>Store Name</label><input type="text" id="sn" value="'+s.name+'"></div><div class="fg"><label>Address</label><input type="text" id="sa" value="'+s.addr+'"></div><div class="fg"><label>Phone</label><input type="text" id="sp" value="'+s.phone+'"></div><div class="fg"><label>Return Policy</label><textarea id="sr" rows="2">'+s.ret+'</textarea></div><button class="bt bp bs" onclick="svSet()">Save</button></div><div class="cd"><h3>💰 Tax & Currency</h3><div class="fg"><label>VAT Rate (%)</label><input type="number" id="stx" step="0.01" min="0" value="'+s.tax+'"></div><div class="fg"><label>Currency Symbol</label><input type="text" id="scu" value="'+s.cur+'"></div><div class="fg"><label>Receipt Footer</label><input type="text" id="sf2" value="'+s.foot+'"></div><button class="bt bp bs" onclick="svSet()">Save</button></div><div class="cd"><h3>🕐 Shift</h3>';if(D.curShift){h+='<p style="font-size:.82rem;margin-bottom:8px">Cashier: <strong>'+D.curShift.cash+'</strong><br>Opened: '+D.curShift.open.slice(5,16)+'</p><button class="bt br bs" onclick="cSh()">Close Shift</button>';}else{h+='<button class="bt bg bs" onclick="oSh()">Open Shift</button>';}h+='</div><div class="cd"><h3>💾 Backup</h3><button class="bt bo bs" onclick="eB()" style="margin:4px">📤 Export</button><button class="bt bo bs" onclick="document.getElementById(\'bf\').click()" style="margin:4px">📥 Import</button><input type="file" id="bf" accept=".json" style="display:none" onchange="iB(event)"><button class="bt br bs" onclick="rD()" style="margin:4px">🗑 Reset All</button></div>';document.getElementById('pg-set').innerHTML=h;}
function svSet(){D.settings.name=document.getElementById('sn').value;D.settings.addr=document.getElementById('sa').value;D.settings.phone=document.getElementById('sp').value;D.settings.ret=document.getElementById('sr').value;D.settings.tax=parseFloat(document.getElementById('stx').value)||0;D.settings.cur=document.getElementById('scu').value||'KES ';D.settings.foot=document.getElementById('sf2').value;sv();T('Settings saved','s');}
function oSh(){var sc=prompt('Starting cash (KES):','0');if(sc===null)return;D.curShift={cash:D.curUser.name,open:new Date().toISOString(),sc:parseFloat(sc)||0};sv();uSh();rA();T('Shift opened','s');}
function cSh(){if(!D.curShift)return;var ec=prompt('Ending cash (KES):','0');if(ec===null)return;D.curShift.close=new Date().toISOString();D.curShift.ec=parseFloat(ec)||0;D.shifts.push(D.curShift);D.curShift=null;sv();uSh();rA();T('Shift closed','s');}
function eB(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moswax_backup.json';a.click();T('Backup exported','s');}
function iB(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{D=JSON.parse(ev.target.result);sv();rA();T('Backup imported','s');}catch(err){T('Invalid file','e');}};r.readAsText(f);}
function rD(){if(!confirm('Delete ALL data? Cannot be undone!'))return;if(!confirm('Are you SURE?'))return;localStorage.removeItem(K);location.reload();}
</script></body></html>
