<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Moswax POS</title>
<style>
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--bg4:#1f2b47;--accent:#00d4ff;--accent2:#0099cc;--green:#00e676;--red:#ff5252;--orange:#ffab40;--text:#e8e8e8;--text2:#9aa;--radius:12px;--shadow:0 4px 20px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw}
input,select,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;outline:none}
input,select,textarea{outline:none;border:1px solid var(--bg4);background:var(--bg2);color:var(--text);padding:10px 14px;border-radius:8px;width:100%}
input:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f0f1a,#1a1a2e)}
.login-box{background:var(--bg2);padding:40px 30px;border-radius:20px;width:90%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.login-box h1{color:var(--accent);font-size:28px;margin-bottom:6px}
.login-box p{color:var(--text2);margin-bottom:24px;font-size:14px}
.login-box input{margin-bottom:14px;text-align:center;font-size:16px}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;font-size:16px;border-radius:10px}
.login-box .err{color:var(--red);font-size:13px;margin-top:8px;min-height:20px}
#appShell{display:none;height:100vh;flex-direction:column}
.topbar{background:var(--bg2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bg4);min-height:52px}
.topbar .brand{color:var(--accent);font-weight:800;font-size:18px}
.topbar .user-info{font-size:12px;color:var(--text2);text-align:right}
.topbar .user-info strong{color:var(--text);display:block}
.main-area{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--bg4);overflow-y:auto;padding:8px 0}
.sidebar button{display:flex;align-items:center;gap:8px;padding:11px 16px;background:none;color:var(--text2);font-size:13px;width:100%;text-align:left}
.sidebar button:hover,.sidebar button.active{background:var(--bg3);color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card .label{font-size:11px;color:var(--text2);margin-bottom:4px}
.card .value{font-size:22px;font-weight:700;color:var(--accent)}
.card .green{color:var(--green)}.card .red{color:var(--red)}.card .orange{color:var(--orange)}
.tbl-wrap{overflow-x:auto;background:var(--bg2);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:10px;text-align:left;color:var(--text2);white-space:nowrap}
td{padding:10px;border-top:1px solid var(--bg4);white-space:nowrap}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#000}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--orange);color:#000}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:14px 24px;font-size:16px}
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:12px;height:calc(100vh - 84px)}
.pos-search{display:flex;gap:8px;margin-bottom:10px}
.pos-search input{flex:1;font-size:15px;padding:10px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;overflow-y:auto;flex:1}
.pos-item{background:var(--bg2);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;border:2px solid transparent}
.pos-item:hover{border-color:var(--accent)}
.pos-item .name{font-size:12px;font-weight:600}.pos-item .price{color:var(--accent);font-weight:700;font-size:13px}.pos-item .stock{font-size:10px;color:var(--text2)}
.pos-item.out{opacity:.35;pointer-events:none}
.pos-cart{background:var(--bg2);border-radius:var(--radius);display:flex;flex-direction:column}
.cart-header{padding:12px;border-bottom:1px solid var(--bg4);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cart-items{flex:1;overflow-y:auto;padding:6px}
.cart-row{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid var(--bg4);font-size:13px}
.cart-row .cname{flex:1}.cart-row .cqty{display:flex;align-items:center;gap:4px}
.cart-row .cqty button{width:24px;height:24px;border-radius:6px;background:var(--bg3);color:var(--text);font-size:14px}
.cart-row .ctotal{font-weight:700;color:var(--accent);min-width:55px;text-align:right}
.cart-row .cremove{color:var(--red);cursor:pointer}
.cart-footer{padding:12px;border-top:1px solid var(--bg4)}
.cart-totals div{display:flex;justify-content:space-between;margin-bottom:3px;font-size:13px}
.cart-totals .grand{font-size:18px;font-weight:800;color:var(--accent)}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cart-actions button{padding:12px;border-radius:8px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-head{padding:16px;border-bottom:1px solid var(--bg4);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px}.modal-head .close{background:none;color:var(--text2);font-size:20px}
.modal-body{padding:16px}.modal-body .field{margin-bottom:12px}
.modal-body .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:3px}
.modal-foot{padding:12px 16px;border-top:1px solid var(--bg4);display:flex;gap:8px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.receipt{background:#fff;color:#000;padding:16px;font-family:'Courier New',monospace;font-size:11px;max-width:280px;margin:0 auto}
.receipt h2{text-align:center;font-size:14px;margin-bottom:2px}
.receipt .rc{text-align:center}.receipt .rl{border-top:1px dashed #000;margin:6px 0}
.receipt table{width:100%}.receipt td{padding:1px 0}.receipt .rr{text-align:right}.receipt .rb{font-weight:700}
.badge{padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(0,230,118,.15);color:var(--green)}
.badge-red{background:rgba(255,82,82,.15);color:var(--red)}
.badge-orange{background:rgba(255,171,64,.15);color:var(--orange)}
.badge-blue{background:rgba(0,212,255,.15);color:var(--accent)}
.alert-bar{padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.alert-warn{background:rgba(255,171,64,.12);color:var(--orange);border:1px solid rgba(255,171,64,.3)}
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pay-method{padding:14px;background:var(--bg3);border-radius:10px;text-align:center;cursor:pointer;border:2px solid transparent}
.pay-method.selected{border-color:var(--accent)}
.pay-method .pm-icon{font-size:24px}.pay-method .pm-label{font-size:11px;font-weight:600}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;z-index:2000;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.settings-section{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.settings-section h3{margin-bottom:12px;color:var(--accent);font-size:15px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg4)}
.bottom-nav{display:none;background:var(--bg2);border-top:1px solid var(--bg4);padding:4px 0}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;color:var(--text2);font-size:9px;padding:4px}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav button .icon{font-size:18px}
@media(max-width:768px){
.sidebar{display:none}.bottom-nav{display:flex}
.pos-layout{grid-template-columns:1fr;height:auto}.pos-cart{max-height:45vh}
.form-grid{grid-template-columns:1fr}.content{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}
}
@media print{body *{visibility:hidden}.receipt,.receipt *{visibility:visible}.receipt{position:absolute;left:0;top:0}}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-box">
<h1>🏪 Moswax POS</h1>
<p>Offline Point of Sale System</p>
<input type="text" id="loginUser" placeholder="Username">
<input type="password" id="loginPass" placeholder="Password">
<button onclick="doLogin()">Sign In</button>
<div class="err" id="loginErr"></div>
</div>
</div>
<div id="appShell">
<div class="topbar">
<div class="brand">🏪 Moswax POS</div>
<div style="display:flex;align-items:center;gap:10px">
<span id="shiftBadge" class="badge badge-orange">No Shift</span>
<div class="user-info"><strong id="topUser">Admin</strong><span id="topRole">admin</span></div>
<button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
</div>
</div>
<div class="main-area">
<nav class="sidebar" id="sidebar"></nav>
<div class="content" id="contentArea"></div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="modal-head"><h3 id="modalTitle">Modal</h3><button class="close" onclick="closeModal()">✕</button></div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-foot" id="modalFoot"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const DB='MoswaxPOS',DV=2;let db,CU=null,CS=null,cart=[];
const ROLES={admin:{l:'Admin',p:['all']},gm:{l:'General Manager',p:['dashboard','pos','products','inventory','sales','reports','shifts','users','settings']},im:{l:'Inventory Manager',p:['dashboard','products','inventory','reports']},sup:{l:'Supervisor',p:['dashboard','pos','sales','reports','shifts']},cashier:{l:'Cashier',p:['pos','sales','shifts']}};
function hp(p){if(!CU)return false;if(CU.role==='admin')return true;return(ROLES[CU.role]?.p||[]).includes(p)}
function openDB(){return new Promise((y,n)=>{const r=indexedDB.open(DB,DV);r.onupgradeneeded=e=>{const d=e.target.result;['users','products','categories','sales','saleItems','payments','invLog','shifts','settings'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;y()};r.onerror=n})}
function gA(s){return new Promise((y,n)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>y(r.result);r.onerror=n})}
function gO(s,id){return new Promise((y,n)=>{const r=db.transaction(s).objectStore(s).get(id);r.onsuccess=()=>y(r.result);r.onerror=n})}
function pO(s,d){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(d);r.onsuccess=()=>y(r.result);r.onerror=n})}
function aO(s,d){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).add(d);r.onsuccess=()=>y(r.result);r.onerror=n})}
function dO(s,id){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>y();r.onerror=n})}
async function init(){
await openDB();
let u=await gA('users');
if(!u.length){
await aO('users',{username:'admin',password:'admin123',name:'Administrator',role:'admin',active:true});
await aO('categories',{name:'General'});
await aO('settings',{storeName:'Moswax Shop',address:'',phone:'',taxRate:0,taxName:'Tax',receiptFooter:'Thank you for shopping!',currency:'$'});
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}
async function doLogin(){
const u=document.getElementById('loginUser').value.trim();
const p=document.getElementById('loginPass').value;
const users=await gA('users');
const f=users.find(x=>x.username===u&&x.password===p&&x.active);
if(!f){document.getElementById('loginErr').textContent='Invalid credentials';return}
CU=f;
document.getElementById('loginScreen').style.display='none';
document.getElementById('appShell').style.display='flex';
document.getElementById('topUser').textContent=f.name;
document.getElementById('topRole').textContent=ROLES[f.role]?.l||f.role;
buildNav();nav('dashboard');
}
function doLogout(){CU=null;CS=null;cart=[];document.getElementById('appShell').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('loginUser').value='';document.getElementById('loginPass').value='';document.getElementById('loginErr').textContent=''}
const NAV=[{id:'dashboard',i:'📊',l:'Dashboard',p:'dashboard'},{id:'pos',i:'🛒',l:'POS',p:'pos'},{id:'products',i:'📦',l:'Products',p:'products'},{id:'inventory',i:'📋',l:'Inventory',p:'inventory'},{id:'sales',i:'💰',l:'Sales',p:'sales'},{id:'reports',i:'📈',l:'Reports',p:'reports'},{id:'users',i:'👥',l:'Users',p:'users'},{id:'shifts',i:'⏰',l:'Shifts',p:'shifts'},{id:'settings',i:'⚙️',l:'Settings',p:'settings'},{id:'backup',i:'💾',l:'Backup',p:'settings'}];
function buildNav(){
const sb=document.getElementById('sidebar'),bn=document.getElementById('bottomNav');sb.innerHTML='';bn.innerHTML='';
const mob=['dashboard','pos','products','sales','settings'];
NAV.forEach(n=>{if(!hp(n.p))return;
let b=document.createElement('button');b.innerHTML=n.i+' '+n.l;b.onclick=()=>nav(n.id);b.dataset.page=n.id;sb.appendChild(b);
if(mob.includes(n.id)){let m=document.createElement('button');m.innerHTML='<span class="icon">'+n.i+'</span>'+n.l;m.onclick=()=>nav(n.id);m.dataset.page=n.id;bn.appendChild(m)}
})}
function nav(page){
if(!hp(page))return;
document.querySelectorAll('.sidebar button,.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
const c=document.getElementById('contentArea');c.innerHTML='<div class="page active" id="pg"></div>';
const el=document.getElementById('pg');
({dashboard:rDash,pos:rPOS,products:rProd,inventory:rInv,sales:rSales,reports:rReports,users:rUsers,shifts:rShifts,settings:rSettings,backup:rBackup})[page]?.(el);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function oM(title,body,foot=''){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function fmt(n){return'$'+Number(n||0).toFixed(2)}
function fD(d){if(!d)return'-';return new Date(d).toLocaleString()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

async function rDash(el){
const sales=await gA('sales'),prods=await gA('products');
const td=new Date().toDateString();
const ts=sales.filter(s=>new Date(s.date).toDateString()===td);
const rev=ts.reduce((a,s)=>a+s.total,0);
const low=prods.filter(p=>p.stock>0&&p.stock<=p.reorder);
const out=prods.filter(p=>p.stock<=0);
el.innerHTML='<h2 style="margin-bottom:14px">📊 Dashboard</h2>'
+(out.length?'<div class="alert-bar alert-warn">⚠️ '+out.length+' product(s) out of stock</div>':'')
+(low.length?'<div class="alert-bar alert-warn">📉 '+low.length+' product(s) low stock</div>':'')
+'<div class="cards">'
+'<div class="card"><div class="label">Today Sales</div><div class="value green">'+fmt(rev)+'</div></div>'
+'<div class="card"><div class="label">Transactions</div><div class="value">'+ts.length+'</div></div>'
+'<div class="card"><div class="label">Products</div><div class="value">'+prods.length+'</div></div>'
+'<div class="card"><div class="label">Low Stock</div><div class="value orange">'+low.length+'</div></div></div>'
+'<h3 style="margin:12px 0 8px">Recent Sales</h3><div class="tbl-wrap"><table><tr><th>Receipt</th><th>Date</th><th>Cashier</th><th>Total</th><th>Pay</th></tr>'
+ts.slice(-10).reverse().map(s=>'<tr><td>'+s.receiptNo+'</td><td>'+fD(s.date)+'</td><td>'+s.cashier+'</td><td>'+fmt(s.total)+'</td><td><span class="badge badge-blue">'+s.payMethod+'</span></td></tr>').join('')
+(!ts.length?'<tr><td colspan="5" style="text-align:center;color:var(--text2)">No sales today</td></tr>':'')
+'</table></div>';
}

async function rPOS(el){
if(!CS){el.innerHTML='<div style="text-align:center;padding:60px 20px"><h2>⏰ No Active Shift</h2><p style="color:var(--text2);margin:12px 0">Open a shift first.</p><button class="btn btn-primary btn-lg" onclick="nav(\'shifts\')">Go to Shifts</button></div>';return}
const prods=await gA('products'),cats=await gA('categories'),sets=await gA('settings');
const tx=sets[0]?.taxRate||0;
el.innerHTML='<div class="pos-layout"><div style="display:flex;flex-direction:column;overflow:hidden">'
+'<div class="pos-search"><input type="text" id="posS" placeholder="🔍 Search / scan barcode..." oninput="fPOS()"><select id="posC" onchange="fPOS()" style="width:130px"><option value="">All</option>'+cats.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select></div>'
+'<div class="pos-grid" id="posG">'+prods.map(p=>'<div class="pos-item '+(p.stock<=0?'out':'')+'" onclick="aTC('+p.id+')" data-n="'+p.name.toLowerCase()+'" data-b="'+(p.barcode||'')+'" data-c="'+p.categoryId+'"><div class="name">'+p.name+'</div><div class="price">'+fmt(p.price)+'</div><div class="stock">Stock:'+p.stock+'</div></div>').join('')+'</div></div>'
+'<div class="pos-cart"><div class="cart-header"><span>🛒 Cart ('+cart.length+')</span><div style="display:flex;gap:4px"><button class="btn btn-outline btn-sm" onclick="sHeld()">Held</button><button class="btn btn-warning btn-sm" onclick="hSale()">Hold</button></div></div>'
+'<div class="cart-items" id="cI">'+rCI()+'</div>'
+'<div class="cart-footer"><div class="cart-totals"><div><span>Subtotal</span><span id="cSub">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0))+'</span></div><div><span>Tax ('+tx+'%)</span><span id="cTax">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*tx/100)+'</span></div><div class="grand"><span>Total</span><span id="cTot">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*(1+tx/100))+'</span></div></div>'
+'<div class="cart-actions"><button class="btn btn-danger" onclick="cart=[];uCU()">Clear</button><button class="btn btn-success" onclick="oPay()" '+(cart.length?'':'disabled style="opacity:.4"')+'>💳 Pay</button></div></div></div></div>';
}
function rCI(){return cart.map((c,i)=>'<div class="cart-row"><span class="cname">'+c.name+'</span><div class="cqty"><button onclick="cQ('+i+',-1)">−</button><span>'+c.qty+'</span><button onclick="cQ('+i+',1)">+</button></div><span class="ctotal">'+fmt(c.price*c.qty)+'</span><span class="cremove" onclick="cart.splice('+i+',1);uCU()">✕</span></div>').join('')||'<div style="text-align:center;padding:20px;color:var(--text2)">Empty</div>'}
function uCU(){
const ci=document.getElementById('cI');if(!ci)return;ci.innerHTML=rCI();
const sets=JSON.parse(localStorage.getItem('mx_s')||'{}');const tx=sets.taxRate||0;
const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
document.getElementById('cSub').textContent=fmt(sub);
document.getElementById('cTax').textContent=fmt(sub*tx/100);
document.getElementById('cTot').textContent=fmt(sub*(1+tx/100));
document.querySelector('.cart-header span').textContent='🛒 Cart ('+cart.length+')';
}
async function aTC(pid){
const p=await gO('products',pid);if(!p||p.stock<=0)return toast('Out of stock!');
const e=cart.find(c=>c.pid===pid);
if(e){if(e.qty>=p.stock)return toast('Max stock');e.qty++}
else cart.push({pid:pid,name:p.name,price:p.price,qty:1,mx:p.stock});
uCU();
}
function cQ(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);if(cart[i]&&cart[i].qty>cart[i].mx){cart[i].qty=cart[i].mx;toast('Max stock')}uCU()}
function fPOS(){const q=document.getElementById('posS').value.toLowerCase(),c=document.getElementById('posC').value;document.querySelectorAll('.pos-item').forEach(e=>{e.style.display=(e.dataset.n.includes(q)||e.dataset.b.includes(q))&&(!c||e.dataset.c===c)?'':'none'})}

async function cSale(total){
const sets=await gA('settings');const tx=sets[0]?.taxRate||0;
const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
const rn='RCP-'+Date.now().toString(36).toUpperCase();
const cust=document.getElementById('pCust')?.value||'Walk-in';
let pm=window._pm;if(pm==='card')pm='Card (External)';
const sid=await aO('sales',{receiptNo:rn,date:new Date().toISOString(),cashier:CU.name,customer:cust,subtotal:sub,tax:sub*tx/100,total:total,payMethod:pm,shiftId:CS?.id,itemCount:cart.length});
for(const c of cart){
await aO('saleItems',{saleId:sid,productId:c.pid,name:c.name,price:c.price,qty:c.qty,total:c.price*c.qty});
const p=await gO('products',c.pid);if(p){p.stock=Math.max(0,p.stock-c.qty);await pO('products',p)}
await aO('invLog',{productId:c.pid,productName:c.name,type:'sale',qty:-c.qty,date:new Date().toISOString(),user:CU.name,ref:rn});
}
await aO('payments',{saleId:sid,method:pm,amount:total,date:new Date().toISOString()});
cart=[];closeModal();toast('✅ Sale complete!');showRcpt({id:sid,receiptNo:rn,date:new Date().toISOString(),cashier:CU.name,customer:cust,subtotal:sub,tax:sub*tx/100,total:total,payMethod:pm});nav('pos');
}

async function dSM(type){
const pid=parseInt(document.getElementById('sPr').value),qty=parseInt(document.getElementById('sQ').value)||0,note=document.getElementById('sN').value;

}

:'<div class="alert-bar alert-warn">No active shift</div><div class="field" style="max-width:300px"><label>Opening Cash</label><input type="number" id="oCash" value="0"></div><button class="btn btn-success btn-lg" onclick="oShift()">Open Shift</button>')
+'<h3 style="margin:20px 0 10px">Shift History</h3><div class="tbl-wrap"><table><tr><th>Date</th><th>User</th><th>Opened</th><th>Closed</th><th>Open Cash</th><th>Close Cash</th><th>Sales</th></tr>'
+shifts.slice().reverse().map(s=>'<tr><td>'+fD(s.openedAt)+'</td><td>'+s.user+'</td><td>'+fD(s.openedAt)+'</td><td>'+(s.closedAt?fD(s.closedAt):'<span class="badge badge-orange">Open</span>')+'</td><td>'+fmt(s.openCash)+'</td><td>'+(s.closeCash!=null?fmt(s.closeCash):'-')+'</td><td>'+fmt(s.totalSales||0)+'</td></tr>').join('')
+(!shifts.length?'<tr><td colspan="7" style="text-align:center;color:var(--text2)">No shifts</td></tr>':'')+'</table></div>';
}
async function oShift(){
const oc=parseFloat(document.getElementById('oCash')?.value)||0;
const sid=await aO('shifts',{user:CU.name,openedAt:new Date().toISOString(),openCash:oc,closedAt:null,closeCash:null,totalSales:0});
CS=await gO('shifts',sid);
document.getElementById('shiftBadge').textContent='Shift Open';document.getElementById('shiftBadge').className='badge badge-green';
toast('Shift opened');nav('shifts');
}
async function cShift(){
if(!CS)return;
const sales=await gA('sales');
const ss=sales.filter(s=>s.shiftId===CS.id);
const tot=ss.reduce((a,s)=>a+s.total,0);
oM('Close Shift','<div style="text-align:center;margin-bottom:12px"><div style="font-size:14px;color:var(--text2)">Total Sales This Shift</div><div style="font-size:28px;font-weight:800;color:var(--green)">'+fmt(tot)+'</div></div><div class="field"><label>Closing Cash Count</label><input type="number" id="clCash" value="'+(CS.openCash+tot).toFixed(2)+'"></div>',
'<button class="btn btn-danger btn-lg" onclick="dCS('+tot+')">Confirm Close</button>');
}
async function dCS(tot){
CS.closedAt=new Date().toISOString();CS.closeCash=parseFloat(document.getElementById('clCash').value)||0;CS.totalSales=tot;
await pO('shifts',CS);CS=null;
document.getElementById('shiftBadge').textContent='No Shift';document.getElementById('shiftBadge').className='badge badge-orange';
closeModal();toast('Shift closed');nav('shifts');
}

async function rSettings(el){
const sets=await gA('settings');const s=sets[0]||{};
el.innerHTML='<h2 style="margin-bottom:14px">⚙️ Settings</h2>'
+'<div class="settings-section"><h3>Store Info</h3><div class="form-grid"><div class="field"><label>Store Name</label><input id="stN" value="'+(s.storeName||'')+'"></div><div class="field"><label>Phone</label><input id="stPh" value="'+(s.phone||'')+'"></div><div class="field full"><label>Address</label><input id="stA" value="'+(s.address||'')+'"></div></div></div>'
+'<div class="settings-section"><h3>Tax</h3><div class="form-grid"><div class="field"><label>Tax Name</label><input id="stTN" value="'+(s.taxName||'Tax')+'"></div><div class="field"><label>Tax Rate (%)</label><input type="number" id="stTR" value="'+(s.taxRate||0)+'" step="0.1"></div></div></div>'
+'<div class="settings-section"><h3>Receipt</h3><div class="field"><label>Footer Message</label><input id="stRF" value="'+(s.receiptFooter||'')+'"></div><div class="field"><label>Currency Symbol</label><input id="stCur" value="'+(s.currency||'$')+'"></div></div>'
+'<button class="btn btn-primary btn-lg" onclick="sSet()">Save Settings</button>';
}
async function sSet(){
const sets=await gA('settings');const s=sets[0]||{id:1};
s.storeName=document.getElementById('stN').value;s.phone=document.getElementById('stPh').value;s.address=document.getElementById('stA').value;
s.taxName=document.getElementById('stTN').value;s.taxRate=parseFloat(document.getElementById('stTR').value)||0;
s.receiptFooter=document.getElementById('stRF').value;s.currency=document.getElementById('stCur').value;
s.id=1;await pO('settings',s);localStorage.setItem('mx_s',JSON.stringify(s));toast('Saved');
}

async function rBackup(el){
el.innerHTML='<h2 style="margin-bottom:14px">💾 Backup & Export</h2>'
+'<div class="settings-section"><h3>Export All Data</h3><p style="color:var(--text2);margin-bottom:12px">Download a complete backup of all your POS data as a JSON file.</p><button class="btn btn-primary btn-lg" onclick="expAll()">📤 Export Backup (JSON)</button></div>'
+'<div class="settings-section"><h3>Import Data</h3><p style="color:var(--text2);margin-bottom:12px">Restore from a previous backup. This will overwrite current data!</p><input type="file" id="impF" accept=".json" style="margin-bottom:8px"><br><button class="btn btn-warning" onclick="impAll()">📥 Import Backup</button></div>'
+'<div class="settings-section"><h3>Export Sales CSV</h3><button class="btn btn-outline" onclick="eR()">📤 Export Sales CSV</button></div>'
+'<div class="settings-section"><h3 style="color:var(--red)">⚠️ Danger Zone</h3><button class="btn btn-danger" onclick="if(confirm(\'DELETE ALL DATA? This cannot be undone!\'))clrAll()">Delete All Data</button></div>';
}
async function expAll(){
const data={};
for(const s of['users','products','categories','sales','saleItems','payments','invLog','shifts','settings']){data[s]=await gA(s)}
const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moswax_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded');
}
async function impAll(){
const f=document.getElementById('impF').files[0];if(!f)return toast('Select file');
const txt=await f.text();const data=JSON.parse(txt);
for(const[s,items]of Object.entries(data)){for(const item of items){await pO(s,item)}}
toast('Data imported!');nav('dashboard');
}
async function clrAll(){
for(const s of['products','categories','sales','saleItems','payments','invLog','shifts']){const items=await gA(s);for(const i of items)await dO(s,i.id)}
toast('Data cleared');nav('dashboard');
}

init();
</script>
</body>
</html>
