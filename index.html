<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Moswax POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0f172a;--b2:#1e293b;--b3:#334155;--ac:#38bdf8;--gn:#22c55e;--rd:#ef4444;--or:#f59e0b;--tx:#f1f5f9;--tx2:#94a3b8}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden;font-size:14px}input,select,button,textarea{font-family:inherit;font-size:13px}button{cursor:pointer;border:none;background:none;color:inherit}input,select,textarea{background:var(--b2);border:1px solid var(--b3);color:var(--tx);padding:8px 10px;border-radius:7px;width:100%;outline:none}input:focus,select:focus{border-color:var(--ac)}
#login{display:flex;align-items:center;justify-content:center;height:100dvh}.lb{background:var(--b2);padding:28px 20px;border-radius:14px;width:90%;max-width:320px;text-align:center}.lb h1{color:var(--ac);font-size:22px}.lb p{color:var(--tx2);font-size:12px;margin-bottom:14px}.lb input{margin-bottom:8px;text-align:center}.lb .bl{width:100%;padding:12px;background:var(--ac);color:#000;font-weight:700;border-radius:8px}.lb .err{color:var(--rd);font-size:11px;min-height:14px;margin-top:4px}
#app{display:none;height:100dvh;flex-direction:column}.top{background:var(--b2);padding:6px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b3)}.top .lg{color:var(--ac);font-weight:800;font-size:14px}.top .ui{font-size:10px;color:var(--tx2);text-align:right}.top .ui b{color:var(--tx);display:block}
.mid{display:flex;flex:1;overflow:hidden}.side{width:160px;background:var(--b2);border-right:1px solid var(--b3);overflow-y:auto;padding:4px 0}.side button{display:block;width:100%;text-align:left;padding:9px 10px;font-size:12px;color:var(--tx2)}.side button.on{background:var(--b3);color:var(--ac);font-weight:600}.main{flex:1;overflow-y:auto;padding:10px}.pg{display:none}.pg.on{display:block}
.bn{display:none;background:var(--b2);border-top:1px solid var(--b3);padding:2px 0}.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px;font-size:8px;color:var(--tx2)}.bn button.on{color:var(--ac)}.bn button span{font-size:16px}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:10px}.cd{background:var(--b2);border-radius:8px;padding:10px}.cd .cl{font-size:10px;color:var(--tx2)}.cd .cv{font-size:17px;font-weight:700;color:var(--ac)}.cd .g{color:var(--gn)}.cd .r{color:var(--rd)}.cd .o{color:var(--or)}
.tw{overflow-x:auto;background:var(--b2);border-radius:8px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:var(--b3);padding:6px 7px;text-align:left;color:var(--tx2);white-space:nowrap}td{padding:6px 7px;border-top:1px solid var(--b3);white-space:nowrap}
.b{padding:5px 10px;border-radius:6px;font-weight:600;font-size:11px;display:inline-flex;align-items:center;gap:3px}.bp{background:var(--ac);color:#000}.bs{background:var(--gn);color:#000}.bd{background:var(--rd);color:#fff}.bw{background:var(--or);color:#000}.bo{border:1px solid var(--ac);color:var(--ac)}.sm{padding:3px 6px;font-size:10px}
.bg{padding:1px 5px;border-radius:8px;font-size:9px;font-weight:600}.bg-g{background:rgba(34,197,94,.15);color:var(--gn)}.bg-r{background:rgba(239,68,68,.15);color:var(--rd)}.bg-o{background:rgba(245,158,11,.15);color:var(--or)}.bg-b{background:rgba(56,189,248,.15);color:var(--ac)}
.al{padding:5px 8px;border-radius:6px;margin-bottom:6px;font-size:11px}.al-w{background:rgba(245,158,11,.1);color:var(--or);border:1px solid rgba(245,158,11,.2)}
.pos{display:grid;grid-template-columns:1fr 300px;gap:6px;height:calc(100dvh - 64px)}.psch{display:flex;gap:4px;margin-bottom:4px}.psch input{flex:1}.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:4px;overflow-y:auto;flex:1}
.pi{background:var(--b2);border-radius:6px;padding:7px 4px;text-align:center;cursor:pointer;border:2px solid transparent}.pi:active{border-color:var(--ac)}.pi .pn{font-size:10px;font-weight:600}.pi .pp{color:var(--ac);font-weight:700;font-size:11px}.pi .ps{font-size:8px;color:var(--tx2)}.pi.out{opacity:.3;pointer-events:none}
.crt{background:var(--b2);border-radius:8px;display:flex;flex-direction:column}.crt-h{padding:7px;border-bottom:1px solid var(--b3);font-weight:700;display:flex;justify-content:space-between;font-size:11px}.crt-i{flex:1;overflow-y:auto;padding:2px}
.cr{display:flex;align-items:center;gap:3px;padding:3px;border-bottom:1px solid var(--b3);font-size:11px}.cr .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cr .cq{display:flex;align-items:center;gap:1px}.cr .cq button{width:18px;height:18px;border-radius:4px;background:var(--b3);font-size:12px}.cr .ct{font-weight:700;color:var(--ac);min-width:40px;text-align:right}.cr .cx{color:var(--rd);cursor:pointer;font-size:12px}
.crt-f{padding:7px;border-top:1px solid var(--b3)}.ctot div{display:flex;justify-content:space-between;margin-bottom:1px;font-size:11px}.ctot .gt{font-size:15px;font-weight:800;color:var(--ac)}.cact{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.cact button{padding:9px;border-radius:6px;font-weight:700}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:8px}.mo.sh{display:flex}.md{background:var(--b2);border-radius:10px;width:100%;max-width:460px;max-height:85dvh;overflow-y:auto}.mh{padding:10px;border-bottom:1px solid var(--b3);display:flex;justify-content:space-between}.mh h3{font-size:14px}.mh .x{font-size:16px;color:var(--tx2)}.mb{padding:10px}.mb .f{margin-bottom:7px}.mb .f label{display:block;font-size:10px;color:var(--tx2);margin-bottom:2px}.mf{padding:7px 10px;border-top:1px solid var(--b3);display:flex;gap:4px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:5px}.fg .fl{grid-column:1/-1}.rcp{background:#fff;color:#000;padding:10px;font-family:monospace;font-size:10px;max-width:250px;margin:0 auto}.rcp h2{text-align:center;font-size:12px}.rcp .rc{text-align:center}.rcp .rl{border-top:1px dashed #000;margin:3px 0}.rcp table{width:100%}.rcp td{padding:1px 0}.rcp .rr{text-align:right}
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}.pms div{padding:8px 3px;background:var(--b3);border-radius:6px;text-align:center;cursor:pointer;border:2px solid transparent}.pms div.sel{border-color:var(--ac)}.pms .ic{font-size:18px}.pms .lb{font-size:9px;font-weight:600}
.sec{background:var(--b2);border-radius:8px;padding:10px;margin-bottom:8px}.sec h3{margin-bottom:6px;color:var(--ac);font-size:12px}.sr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--b3)}.sr:last-child{border:none}
.tabs{display:flex;gap:2px;margin-bottom:8px;overflow-x:auto}.tabs button{padding:5px 10px;background:var(--b2);color:var(--tx2);border-radius:5px 5px 0 0;font-size:10px;white-space:nowrap}.tabs button.on{background:var(--b3);color:var(--ac);font-weight:600}
.chk{display:flex;align-items:center;gap:4px;padding:3px 0;font-size:12px}.chk input{width:15px;height:15px;accent-color:var(--ac)}
.at{padding:1px 4px;border-radius:3px;font-size:9px;font-weight:600}.at-a{background:rgba(56,189,248,.15);color:var(--ac)}.at-l{background:rgba(239,68,68,.15);color:var(--rd)}.at-e{background:rgba(168,85,247,.15);color:#a855f7}.at-r{background:rgba(34,197,94,.15);color:var(--gn)}.at-x{background:rgba(245,158,11,.15);color:var(--or)}
.dr{color:var(--ac)}.cr2{color:var(--gn)}
.scanner-box{position:relative;width:100%;max-width:320px;margin:0 auto;border-radius:10px;overflow:hidden;background:#000}.scanner-box video{width:100%;display:block}.scanner-box .scan-line{position:absolute;top:50%;left:10%;right:10%;height:2px;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:scanMove 2s infinite}
@keyframes scanMove{0%,100%{top:30%}50%{top:70%}}
.scan-result{background:rgba(34,197,94,.15);border:1px solid var(--gn);border-radius:8px;padding:10px;margin-top:8px;text-align:center;color:var(--gn);font-weight:600}
.imp-preview{max-height:200px;overflow-y:auto;margin-top:8px;font-size:11px}
.imp-preview table{font-size:10px}
.imp-ok{color:var(--gn)}.imp-err{color:var(--rd)}
@media(max-width:768px){.side{display:none}.bn{display:flex}.pos{grid-template-columns:1fr;height:auto}.crt{max-height:38dvh}.fg{grid-template-columns:1fr}.main{padding:6px}.cds{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}.rcp,.rcp *{visibility:visible}.rcp{position:absolute;left:0;top:0}}
</style></head><body>
<div id="login"><div class="lb"><h1>🏪 Moswax POS</h1><p>Offline POS</p><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button class="bl" onclick="doLogin()">Sign In</button><div class="err" id="le"></div></div></div>
<div id="app"><div class="top"><div class="lg">🏪 Moswax</div><div style="display:flex;align-items:center;gap:5px"><div class="ui"><b id="tu">Admin</b><span id="tr">Admin</span></div><button class="bo sm" onclick="doLogout()">Out</button></div></div><div class="mid"><nav class="side" id="side"></nav><div class="main" id="mc"></div></div><nav class="bn" id="bnav"></nav></div>
<div class="mo" id="mo"><div class="md"><div class="mh"><h3 id="mt"></h3><button class="x" onclick="cM()">✕</button></div><div class="mb" id="mbd"></div><div class="mf" id="mft"></div></div></div>
<div id="toast" style="position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:var(--b3);padding:7px 14px;border-radius:7px;font-size:11px;z-index:2000;opacity:0;transition:.3s;pointer-events:none"></div>
<script src="app.js"></script><script src="pos.js"></script><script src="inv.js"></script><script src="fin.js"></script><script src="usr.js"></script><script src="set.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init();</script>
</body></html>
