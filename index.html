<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Moswax POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--b2:#1e293b;--b3:#334155;--ac:#38bdf8;--gn:#22c55e;--rd:#ef4444;--or:#f59e0b;--tx:#f1f5f9;--tx2:#94a3b8}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden;font-size:14px}
input,select,button,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{background:var(--b2);border:1px solid var(--b3);color:var(--tx);padding:9px 11px;border-radius:8px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac)}
#login{display:flex;align-items:center;justify-content:center;height:100dvh}
.lb{background:var(--b2);padding:30px 22px;border-radius:16px;width:90%;max-width:340px;text-align:center}
.lb h1{color:var(--ac);font-size:22px}.lb p{color:var(--tx2);font-size:12px;margin-bottom:16px}
.lb input{margin-bottom:8px;text-align:center}.lb .bl{width:100%;padding:12px;background:var(--ac);color:#000;font-weight:700;border-radius:10px}
.lb .err{color:var(--rd);font-size:12px;min-height:16px;margin-top:4px}
#app{display:none;height:100dvh;flex-direction:column}
.top{background:var(--b2);padding:7px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b3)}
.top .lg{color:var(--ac);font-weight:800;font-size:15px}
.top .ui{font-size:10px;color:var(--tx2);text-align:right}.top .ui b{color:var(--tx);display:block}
.mid{display:flex;flex:1;overflow:hidden}
.side{width:170px;background:var(--b2);border-right:1px solid var(--b3);overflow-y:auto;padding:4px 0}
.side button{display:block;width:100%;text-align:left;padding:10px 12px;font-size:12px;color:var(--tx2)}
.side button.on{background:var(--b3);color:var(--ac);font-weight:600}
.main{flex:1;overflow-y:auto;padding:12px}
.pg{display:none}.pg.on{display:block}
.bn{display:none;background:var(--b2);border-top:1px solid var(--b3);padding:2px 0}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px;font-size:8px;color:var(--tx2)}
.bn button.on{color:var(--ac)}.bn button span{font-size:16px}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.cd{background:var(--b2);border-radius:8px;padding:12px}
.cd .cl{font-size:10px;color:var(--tx2)}.cd .cv{font-size:18px;font-weight:700;color:var(--ac)}
.cd .g{color:var(--gn)}.cd .r{color:var(--rd)}.cd .o{color:var(--or)}
.tw{overflow-x:auto;background:var(--b2);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--b3);padding:7px 8px;text-align:left;color:var(--tx2);white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--b3);white-space:nowrap}
.b{padding:6px 12px;border-radius:7px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.bp{background:var(--ac);color:#000}.bs{background:var(--gn);color:#000}
.bd{background:var(--rd);color:#fff}.bw{background:var(--or);color:#000}
.bo{border:1px solid var(--ac);color:var(--ac)}.sm{padding:3px 7px;font-size:10px}
.bg{padding:2px 6px;border-radius:10px;font-size:9px;font-weight:600}
.bg-g{background:rgba(34,197,94,.15);color:var(--gn)}.bg-r{background:rgba(239,68,68,.15);color:var(--rd)}
.bg-o{background:rgba(245,158,11,.15);color:var(--or)}.bg-b{background:rgba(56,189,248,.15);color:var(--ac)}
.al{padding:6px 10px;border-radius:6px;margin-bottom:8px;font-size:11px}
.al-w{background:rgba(245,158,11,.1);color:var(--or);border:1px solid rgba(245,158,11,.2)}
.pos{display:grid;grid-template-columns:1fr 320px;gap:8px;height:calc(100dvh - 68px)}
.psch{display:flex;gap:4px;margin-bottom:6px}.psch input{flex:1}
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px;overflow-y:auto;flex:1}
.pi{background:var(--b2);border-radius:7px;padding:8px 5px;text-align:center;cursor:pointer;border:2px solid transparent}
.pi:active{border-color:var(--ac)}.pi .pn{font-size:10px;font-weight:600}.pi .pp{color:var(--ac);font-weight:700;font-size:11px}.pi .ps{font-size:9px;color:var(--tx2)}
.pi.out{opacity:.3;pointer-events:none}
.crt{background:var(--b2);border-radius:8px;display:flex;flex-direction:column}
.crt-h{padding:8px;border-bottom:1px solid var(--b3);font-weight:700;display:flex;justify-content:space-between;font-size:12px}
.crt-i{flex:1;overflow-y:auto;padding:3px}
.cr{display:flex;align-items:center;gap:3px;padding:4px;border-bottom:1px solid var(--b3);font-size:11px}
.cr .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .cq{display:flex;align-items:center;gap:2px}
.cr .cq button{width:20px;height:20px;border-radius:4px;background:var(--b3);font-size:13px}
.cr .ct{font-weight:700;color:var(--ac);min-width:45px;text-align:right}
.cr .cx{color:var(--rd);cursor:pointer}
.crt-f{padding:8px;border-top:1px solid var(--b3)}
.ctot div{display:flex;justify-content:space-between;margin-bottom:2px;font-size:11px}
.ctot .gt{font-size:16px;font-weight:800;color:var(--ac)}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.cact button{padding:10px;border-radius:7px;font-weight:700}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center;padding:10px}
.mo.sh{display:flex}
.md{background:var(--b2);border-radius:12px;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto}
.mh{padding:12px;border-bottom:1px solid var(--b3);display:flex;justify-content:space-between}
.mh h3{font-size:15px}.mh .x{font-size:18px;color:var(--tx2)}
.mb{padding:12px}.mb .f{margin-bottom:8px}
.mb .f label{display:block;font-size:10px;color:var(--tx2);margin-bottom:2px}
.mf{padding:8px 12px;border-top:1px solid var(--b3);display:flex;gap:4px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fg .fl{grid-column:1/-1}
.rcp{background:#fff;color:#000;padding:12px;font-family:monospace;font-size:10px;max-width:260px;margin:0 auto}
.rcp h2{text-align:center;font-size:13px}.rcp .rc{text-align:center}.rcp .rl{border-top:1px dashed #000;margin:4px 0}
.rcp table{width:100%}.rcp td{padding:1px 0}.rcp .rr{text-align:right}
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.pms div{padding:10px 4px;background:var(--b3);border-radius:7px;text-align:center;cursor:pointer;border:2px solid transparent}
.pms div.sel{border-color:var(--ac)}.pms .ic{font-size:20px}.pms .lb{font-size:9px;font-weight:600}
.sec{background:var(--b2);border-radius:8px;padding:12px;margin-bottom:10px}
.sec h3{margin-bottom:8px;color:var(--ac);font-size:13px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b3)}
.sr:last-child{border:none}
.tabs{display:flex;gap:3px;margin-bottom:10px;overflow-x:auto}
.tabs button{padding:6px 12px;background:var(--b2);color:var(--tx2);border-radius:6px 6px 0 0;font-size:11px;white-space:nowrap}
.tabs button.on{background:var(--b3);color:var(--ac);font-weight:600}
.chk{display:flex;align-items:center;gap:5px;padding:4px 0;font-size:12px}
.chk input{width:16px;height:16px;accent-color:var(--ac)}
.at{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600}
.at-a{background:rgba(56,189,248,.15);color:var(--ac)}.at-l{background:rgba(239,68,68,.15);color:var(--rd)}
.at-e{background:rgba(168,85,247,.15);color:#a855f7}.at-r{background:rgba(34,197,94,.15);color:var(--gn)}
.at-x{background:rgba(245,158,11,.15);color:var(--or)}
.dr{color:var(--ac)}.cr2{color:var(--gn)}
@media(max-width:768px){.side{display:none}.bn{display:flex}.pos{grid-template-columns:1fr;height:auto}.crt{max-height:40dvh}.fg{grid-template-columns:1fr}.main{padding:8px}.cds{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}.rcp,.rcp *{visibility:visible}.rcp{position:absolute;left:0;top:0}}
</style>
</head>
<body>
<div id="login"><div class="lb"><h1>🏪 Moswax POS</h1><p>Offline Point of Sale</p><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button class="bl" onclick="doLogin()">Sign In</button><div class="err" id="le"></div></div></div>
<div id="app">
<div class="top"><div class="lg">🏪 Moswax POS</div><div style="display:flex;align-items:center;gap:6px"><div class="ui"><b id="tu">Admin</b><span id="tr">Admin</span></div><button class="bo sm" onclick="doLogout()">Logout</button></div></div>
<div class="mid"><nav class="side" id="side"></nav><div class="main" id="mc"></div></div>
<nav class="bn" id="bnav"></nav>
</div>
<div class="mo" id="mo"><div class="md"><div class="mh"><h3 id="mt"></h3><button class="x" onclick="cM()">✕</button></div><div class="mb" id="mbd"></div><div class="mf" id="mft"></div></div></div>
<div id="toast" style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--b3);padding:8px 16px;border-radius:8px;font-size:12px;z-index:2000;opacity:0;transition:.3s;pointer-events:none"></div>
<script>
const DN='MxPOS5';let db,CU=null,cart=[];
const RL={admin:'Admin',manager:'Manager',cashier:'Cashier',stock:'Stock Keeper'};
const DP={admin:{dashboard:1,pos:1,inventory:1,finance:1,users:1,settings:1},manager:{dashboard:1,pos:1,inventory:1,finance:1,users:0,settings:1},cashier:{dashboard:0,pos:1,inventory:0,finance:0,users:0,settings:0},stock:{dashboard:0,pos:0,inventory:1,finance:0,users:0,settings:0}};
function hp(m){if(!CU)return false;const p=CU.perms||DP[CU.role]||{};return!!p[m]}
function oDB(){return new Promise((y,n)=>{const r=indexedDB.open(DN,1);r.onupgradeneeded=e=>{const d=e.target.result;['users','products','categories','sales','saleItems','invLog','settings','accounts','journal'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;y()};r.onerror=n})}
function gA(s){return new Promise((y,n)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>y(r.result);r.onerror=n})}
function gO(s,id){return new Promise((y,n)=>{const r=db.transaction(s).objectStore(s).get(id);r.onsuccess=()=>y(r.result);r.onerror=n})}
function pO(s,d){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(d);r.onsuccess=()=>y(r.result);r.onerror=n})}
function aO(s,d){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).add(d);r.onsuccess=()=>y(r.result);r.onerror=n})}
function dO(s,id){return new Promise((y,n)=>{const r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>y();r.onerror=n})}
async function init(){try{await oDB();let u=await gA('users');if(!u.length){await aO('users',{username:'admin',password:'admin123',name:'Administrator',role:'admin',perms:DP.admin,active:true});await aO('categories',{name:'General'});await aO('settings',{storeName:'Moswax Shop',address:'',phone:'',taxRate:0,taxName:'VAT',footer:'Thank you for shopping!',currency:'KSh'});const ac=[{c:'1000',n:'Cash',t:'Asset'},{c:'1010',n:'Bank',t:'Asset'},{c:'1020',n:'M-Pesa',t:'Asset'},{c:'1100',n:'Inventory',t:'Asset'},{c:'1200',n:'Fixed Assets',t:'Asset'},{c:'2000',n:'Accounts Payable',t:'Liability'},{c:'2100',n:'Loans',t:'Liability'},{c:'3000',n:'Owner Equity',t:'Equity'},{c:'3100',n:'Retained Earnings',t:'Equity'},{c:'4000',n:'Sales Revenue',t:'Revenue'},{c:'4100',n:'Other Income',t:'Revenue'},{c:'5000',n:'Cost of Goods',t:'Expense'},{c:'5100',n:'Rent',t:'Expense'},{c:'5200',n:'Salaries',t:'Expense'},{c:'5300',n:'Utilities',t:'Expense'},{c:'5400',n:'Transport',t:'Expense'},{c:'5500',n:'Other Expense',t:'Expense'}];for(const a of ac)await aO('accounts',a)}document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}catch(e){document.getElementById('le').textContent='Error'}}
async function doLogin(){const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;try{const us=await gA('users'),f=us.find(x=>x.username===u&&x.password===p&&x.active);if(!f){document.getElementById('le').textContent='Invalid credentials';return}CU=f;document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('tu').textContent=f.name;document.getElementById('tr').textContent=RL[f.role]||f.role;bNav();go(hp('dashboard')?'dashboard':'pos')}catch(e){document.getElementById('le').textContent='Error'}}
function doLogout(){CU=null;cart=[];document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('lu').value='';document.getElementById('lp').value='';document.getElementById('le').textContent=''}
const NV=[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'pos',i:'🛒',l:'POS'},{id:'inventory',i:'📦',l:'Inventory'},{id:'finance',i:'💰',l:'Finance'},{id:'users',i:'👥',l:'Users'},{id:'settings',i:'⚙️',l:'Settings'}];
function bNav(){const s=document.getElementById('side'),b=document.getElementById('bnav');s.innerHTML='';b.innerHTML='';const m=['pos','inventory','finance','settings'];NV.forEach(n=>{if(!hp(n.id))return;let e=document.createElement('button');e.textContent=n.i+' '+n.l;e.onclick=()=>go(n.id);e.dataset.p=n.id;s.appendChild(e);let e2=document.createElement('button');e2.innerHTML='<span>'+n.i+'</span>'+n.l;e2.onclick=()=>go(n.id);e2.dataset.p=n.id;b.appendChild(e2)})}
function go(p){if(!hp(p))return;document.querySelectorAll('.side button,.bn button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));document.getElementById('mc').innerHTML='<div class="pg on" id="pg"></div>';const el=document.getElementById('pg');({dashboard:rDash,pos:rPOS,inventory:rInv,finance:rFin,users:rUsr,settings:rSet})[p]?.(el)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2500)}
function oM(t,b,f=''){document.getElementById('mt').textContent=t;document.getElementById('mbd').innerHTML=b;document.getElementById('mft').innerHTML=f;document.getElementById('mo').classList.add('sh')}
function cM(){document.getElementById('mo').classList.remove('sh')}
function fmt(n){return'KSh '+Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fD(d){return d?new Date(d).toLocaleString():'-'}
function fDs(d){return d?new Date(d).toLocaleDateString('en-KE'):'-'}
async function rDash(el){const sa=await gA('sales'),pr=await gA('products'),td=new Date().toDateString(),ts=sa.filter(s=>new Date(s.date).toDateString()===td),rv=ts.reduce((a,s)=>a+s.total,0),lo=pr.filter(p=>p.stock>0&&p.stock<=p.reorder),ou=pr.filter(p=>p.stock<=0),mn=new Date(),mR=sa.filter(s=>{const d=new Date(s.date);return d.getMonth()===mn.getMonth()&&d.getFullYear()===mn.getFullYear()}).reduce((a,s)=>a+s.total,0);el.innerHTML='<h2 style="margin-bottom:10px">📊 Dashboard</h2>'+(ou.length?'<div class="al al-w">⚠️ '+ou.length+' out of stock</div>':'')+'<div class="cds"><div class="cd"><div class="cl">Today</div><div class="cv g">'+fmt(rv)+'</div></div><div class="cd"><div class="cl">Orders</div><div class="cv">'+ts.length+'</div></div><div class="cd"><div class="cl">Month</div><div class="cv">'+fmt(mR)+'</div></div><div class="cd"><div class="cl">Products</div><div class="cv">'+pr.length+'</div></div></div><h3 style="margin:8px 0 4px">Recent</h3><div class="tw"><table><tr><th>Receipt</th><th>Date</th><th>Cashier</th><th>Total</th><th>Pay</th></tr>'+ts.slice(-8).reverse().map(s=>'<tr><td>'+s.rn+'</td><td>'+fD(s.date)+'</td><td>'+s.cashier+'</td><td><b>'+fmt(s.total)+'</b></td><td><span class="bg bg-b">'+s.pm+'</span></td></tr>').join('')+(!ts.length?'<tr><td colspan="5" style="text-align:center;color:var(--tx2)">No sales</td></tr>':'')+'</table></div>'}
async function rPOS(el){const pr=await gA('products'),ca=await gA('categories'),se=await gA('settings'),tx=se[0]?.taxRate||0;el.innerHTML='<div class="pos"><div style="display:flex;flex-direction:column;overflow:hidden"><div class="psch"><input id="ps" placeholder="🔍 Search/scan..." oninput="fP()"><select id="pc" onchange="fP()" style="width:100px"><option value="">All</option>'+ca.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select></div><div class="pgr">'+pr.map(p=>'<div class="pi '+(p.stock<=0?'out':'')+'" onclick="aC('+p.id+')" data-n="'+p.name.toLowerCase()+'" data-b="'+(p.barcode||'')+'" data-c="'+p.catId+'"><div class="pn">'+p.name+'</div><div class="pp">'+fmt(p.price)+'</div><div class="ps">Stk:'+p.stock+'</div></div>').join('')+'</div></div><div class="crt"><div class="crt-h"><span>🛒('+cart.length+')</span><div style="display:flex;gap:3px"><button class="bo sm" onclick="sH()">Held</button><button class="bw sm" onclick="hS()">Hold</button></div></div><div class="crt-i" id="ci">'+rCI()+'</div><div class="crt-f"><div class="ctot"><div><span>Sub</span><span id="cS">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0))+'</span></div><div><span>'+(se[0]?.taxName||'VAT')+'('+tx+'%)</span><span id="cT">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*tx/100)+'</span></div><div class="gt"><span>Total</span><span id="cTo">'+fmt(cart.reduce((a,c)=>a+c.price*c.qty,0)*(1+tx/100))+'</span></div></div><div class="cact"><button class="bd" onclick="cart=[];uC()">Clear</button><button class="bs" onclick="oPay()" '+(cart.length?'':'disabled style="opacity:.4"')+'>💳 Pay</button></div></div></div></div>'}
function rCI(){return cart.map((c,i)=>'<div class="cr"><span class="cn">'+c.name+'</span><div class="cq"><button onclick="cQ('+i+',-1)">−</button><span>'+c.qty+'</span><button onclick="cQ('+i+',1)">+</button></div><span class="ct">'+fmt(c.price*c.qty)+'</span><span class="cx" onclick="cart.splice('+i+',1);uC()">✕</span></div>').join('')||'<div style="text-align:center;padding:16px;color:var(--tx2)">Empty</div>'}
function uC(){const e=document.getElementById('ci');if(!e)return;e.innerHTML=rCI();const se=JSON.parse(localStorage.getItem('mx_s')||'{}'),tx=se.taxRate||0,sub=cart.reduce((a,c)=>a+c.price*c.qty,0);document.getElementById('cS').textContent=fmt(sub);document.getElementById('cT').textContent=fmt(sub*tx/100);document.getElementById('cTo').textContent=fmt(sub*(1+tx/100));document.querySelector('.crt-h span').textContent='🛒('+cart.length+')'}
async function aC(pid){const p=await gO('products',pid);if(!p||p.stock<=0)return toast('Out of stock!');const e=cart.find(c=>c.pid===pid);if(e){if(e.qty>=p.stock)return toast('Max');e.qty++}else cart.push({pid,name:p.name,price:p.price,qty:1,mx:p.stock});uC()}
function cQ(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);if(cart[i]&&cart[i].qty>cart[i].mx){cart[i].qty=cart[i].mx}uC()}
function fP(){const q=document.getElementById('ps').value.toLowerCase(),c=document.getElementById('pc').value;document.querySelectorAll('.pi').forEach(e=>{e.style.display=(e.dataset.n.includes(q)||e.dataset.b.includes(q))&&(!c||e.dataset.c===c)?'':'none'})}
function hS(){if(!cart.length)return toast('Empty');const h=JSON.parse(localStorage.getItem('mx_h')||'[]');h.push({id:Date.now().toString(36),items:[...cart],date:new Date().toISOString(),user:CU.name});localStorage.setItem('mx_h',JSON.stringify(h));cart=[];uC();toast('Held')}
function sH(){const h=JSON.parse(localStorage.getItem('mx_h')||'[]');if(!h.length)return toast('None');oM('Held',h.map(x=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid var(--b3)"><div><b>'+x.items.length+' items</b><br><small style="color:var(--tx2)">'+fD(x.date)+'</small></div><div style="display:flex;gap:3px"><button class="bp sm" onclick="rS(\''+x.id+'\')">Resume</button><button class="bd sm" onclick="dH(\''+x.id+'\')">Del</button></div></div>').join(''))}
function rS(id){const h=JSON.parse(localStorage.getItem('mx_h')||'[]'),x=h.find(a=>a.id===id);if(x){cart=x.items;uC()}localStorage.setItem('mx_h',JSON.stringify(h.filter(a=>a.id!==id)));cM();toast('Resumed')}

async function sLed(){const aId=parseInt(document.getElementById('lAc').value),v=document.getElementById('lV');if(!aId){v.innerHTML='';return}const jrn=await gA('journal'),ac=await gA('accounts'),a=ac.find(x=>x.id===aId),isDr=a&&(a.t==='Asset'||a.t==='Expense');const ent=[];jrn.forEach(j=>j.lines.forEach(l=>{if(l.ai===aId)ent.push({date:j.date,desc:j.desc,ref:j.ref,dr:l.dr,cr:l.cr})}));ent.sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=0;v.innerHTML='<div class="tw" style="margin-top:6px"><table><tr><th>Date</th><th>Desc</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>'+ent.map(e=>{isDr?bal+=e.dr-e.cr:bal+=e.cr-e.dr;return'<tr><td>'+fDs(e.date)+'</td><td>'+e.desc+'</td><td class="dr">'+(e.dr?fmt(e.dr):'-')+'</td><td class="cr2">'+(e.cr?fmt(e.cr):'-')+'</td><td><b>'+fmt(bal)+'</b></td></tr>'}).join('')+(!ent.length?'<tr><td colspan="5" style="text-align:center;color:var(--tx2)">No data</td></tr>':'')+'</table></div>'}
async function rTB(){const v=document.getElementById('tbV');if(!v)return;const jrn=await gA('journal'),ac=await gA('accounts'),bl={};ac.forEach(a=>bl[a.id]={n:a.n,c:a.c,t:a.t,dr:0,cr:0});jrn.forEach(j=>j.lines.forEach(l=>{if(bl[l.ai]){bl[l.ai].dr+=l.dr;bl[l.ai].cr+=l.cr}}));let tD=0,tC=0;const rows=Object.values(bl).filter(b=>b.dr||b.cr).sort((a,b)=>a.c-b.c);rows.forEach(b=>{const n=b.dr-b.cr;n>0?tD+=n:tC+=Math.abs(n)});v.innerHTML='<div class="tw"><table><tr><th>Code</th><th>Account</th><th>Debit</th><th>Credit</th></tr>'+rows.map(b=>{const n=b.dr-b.cr;return'<tr><td>'+b.c+'</td><td>'+b.n+'</td><td class="dr">'+(n>0?fmt(n):'-')+'</td><td class="cr2">'+(n<0?fmt(Math.abs(n)):'-')+'</td></tr>'}).join('')+'<tr style="font-weight:700;border-top:2px solid var(--ac)"><td></td><td>TOTAL</td><td class="dr">'+fmt(tD)+'</td><td class="cr2">'+fmt(tC)+'</td></tr><tr><td colspan="4" style="text-align:center;color:'+(Math.abs(tD-tC)<0.01?'var(--gn)':'var(--rd)')+'">'+(Math.abs(tD-tC)<0.01?'✅ Balanced':'⚠️ Off by '+fmt(Math.abs(tD-tC)))+'</td></tr></table></div>'}
async function rPL(){const v=document.getElementById('plV');if(!v)return;const jrn=await gA('journal'),ac=await gA('accounts'),bl={};ac.filter(a=>a.t==='Revenue'||a.t==='Expense').forEach(a=>bl[a.id]={n:a.n,t:a.t,dr:0,cr:0});jrn.forEach(j=>j.lines.forEach(l=>{if(bl[l.ai]){bl[l.ai].dr+=l.dr;bl[l.ai].cr+=l.cr}}));let tR=0,tE=0;const rv=[],ex=[];Object.values(bl).forEach(b=>{if(b.t==='Revenue'){const n=b.cr-b.dr;tR+=n;rv.push({n:b.n,a:n})}else{const n=b.dr-b.cr;tE+=n;ex.push({n:b.n,a:n})}});v.innerHTML='<div class="sec"><h3>Revenue</h3>'+rv.filter(r=>r.a).map(r=>'<div class="sr"><span>'+r.n+'</span><b class="cr2">'+fmt(r.a)+'</b></div>').join('')+'<div class="sr" style="font-weight:700"><span>Total</span><b class="cr2">'+fmt(tR)+'</b></div></div><div class="sec"><h3>Expenses</h3>'+ex.filter(r=>r.a).map(r=>'<div class="sr"><span>'+r.n+'</span><b class="dr">'+fmt(r.a)+'</b></div>').join('')+'<div class="sr" style="font-weight:700"><span>Total</span><b class="dr">'+fmt(tE)+'</b></div></div><div class="sec" style="border:2px solid '+(tR-tE>=0?'var(--gn)':'var(--rd)')+'"><h3>'+(tR-tE>=0?'📈 Net Profit':'📉 Net Loss')+'</h3><div style="font-size:24px;font-weight:800;color:'+(tR-tE>=0?'var(--gn)':'var(--rd)')+'">'+fmt(Math.abs(tR-tE))+'</div></div>'}

function uPP(){const r=document.getElementById('uR').value,d=DP[r]||{};document.getElementById('pm0').checked=!!d.dashboard;document.getElementById('pm1').checked=!!d.pos;document.getElementById('pm2').checked=!!d.inventory;document.getElementById('pm3').checked=!!d.finance;document.getElementById('pm4').checked=!!d.users;document.getElementById('pm5').checked=!!d.settings}
